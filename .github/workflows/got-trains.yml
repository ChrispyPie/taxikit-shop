name: GOT train cache
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

concurrency:
  group: got-trains
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Fetch Trafikverket G
        env:
          TRAFIKVERKET_KEY: ${{ secrets.TRAFIKVERKET_KEY }}
          TRAIN_OUT: skiftlogg/feed/tag.json
        run: python3 scripts/fetch_got_trains.py
      - name: Commit cache if changed
        run: |
          set -e
          git config user.name "taxikit-bot"
          git config user.email "bot@taxikit.local"
          git add skiftlogg/feed/tag.json
          if git diff --staged --quiet; then
            echo "Ingen ändring"
            exit 0
          fi
          git commit -m "chore: uppdatera tågcache"
          # Spara den nya filen. Bara detta workflow skriver skiftlogg/feed/tag.json,
          # så vid krock: hämta senaste main, lägg tillbaka filen och committa igen
          # (inga nya API-anrop).
          cp skiftlogg/feed/tag.json "$RUNNER_TEMP/cache.json"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push ok ($i)"
              exit 0
            fi
            echo "Push krockade, försöker igen ($i)"
            sleep $((i * 3))
            git fetch --depth 1 origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/cache.json" skiftlogg/feed/tag.json
            git add skiftlogg/feed/tag.json
            if git diff --staged --quiet; then
              echo "Ingen ändring efter reset"
              exit 0
            fi
            git commit -m "chore: uppdatera tågcache"
          done
          echo "Kunde inte pusha efter 3 försök"
          exit 1
