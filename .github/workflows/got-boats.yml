name: GOT boat cache
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

concurrency:
  group: got-boats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install AIS-klient
        run: pip install -q 'websockets>=12'
      - name: Fetch Stena Göteborg
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          BAT_OUT: skiftlogg/feed/bat.json
        run: python3 scripts/fetch_got_boats.py
      - name: Commit cache if changed
        run: |
          set -e
          git config user.name "taxikit-bot"
          git config user.email "bot@taxikit.local"
          git add skiftlogg/feed/bat.json
          if git diff --staged --quiet; then
            echo "Ingen ändring"
            exit 0
          fi
          git commit -m "chore: uppdatera båtcache"
          cp skiftlogg/feed/bat.json "$RUNNER_TEMP/cache.json"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push ok ($i)"
              exit 0
            fi
            echo "Push krockade, försöker igen ($i)"
            sleep $((i * 3))
            git fetch --depth 1 origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/cache.json" skiftlogg/feed/bat.json
            git add skiftlogg/feed/bat.json
            if git diff --staged --quiet; then
              echo "Ingen ändring efter reset"
              exit 0
            fi
            git commit -m "chore: uppdatera båtcache"
          done
          echo "Kunde inte pusha efter 3 försök"
          exit 1
