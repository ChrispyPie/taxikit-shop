name: Kalender evenemang
# Hämtar evenemang (goteborg.com, Got Event, Svenska Mässan) och skickar dem till Supabase
# via RPC events_ingest. Ingen commit, ingen push. 2 s mellan anrop, tydlig User-Agent.
# Körs 06:17 och 18:17 svensk sommartid (04:17/16:17 UTC). Secrets: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, EVENTS_INGEST_KEY.
on:
  workflow_dispatch:
    inputs:
      city:
        description: "Stad (nyckel i scripts/kalender_cities.json)"
        default: "goteborg"
  schedule:
    - cron: "30 4,16 * * *"   # 05:30 och 17:30 svensk vintertid (06:30/18:30 sommartid), UTC

concurrency:
  group: kalender-events
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        city: ["goteborg"]   # nya städer: lägg till här + i kalender_cities.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Hämta och ladda upp
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EVENTS_INGEST_KEY: ${{ secrets.EVENTS_INGEST_KEY }}
        run: python3 scripts/fetch_events.py --city "${{ github.event.inputs.city || matrix.city }}" --out "$RUNNER_TEMP/events.json" --upload
