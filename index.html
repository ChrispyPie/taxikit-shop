<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaxiKit – Butiken är under uppbyggnad</title>
<meta name="description" content="Snart öppnar här en butik för en taxichaufförs alla behov. TaxiKit är under uppbyggnad.">
<meta name="theme-color" content="#111111">
<link rel="canonical" href="https://taxikit.shop/">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon-shop.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TaxiKit">
<meta property="og:locale" content="sv_SE">
<meta property="og:url" content="https://taxikit.shop/">
<meta property="og:title" content="TaxiKit – Butiken är under uppbyggnad">
<meta property="og:description" content="Snart öppnar här en butik för en taxichaufförs alla behov.">
<meta property="og:image" content="https://taxikit.shop/assets/og-comingsoon.jpg">
<meta property="og:image:width" content="1200">

<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --bg:#111; --fg:#f4f4f2; --muted:#a9a9a4; --yellow:#f6c200; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    min-height:100vh; display:flex; flex-direction:column;
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5;
  }
  .checker { height:14px; background:
    repeating-linear-gradient(90deg,var(--yellow) 0 14px,#111 14px 28px); }
  .checker.b { background:
    repeating-linear-gradient(90deg,#111 0 14px,var(--yellow) 14px 28px); }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 22px; max-width:560px; margin:0 auto; }
  .logo { width:220px; max-width:70vw; height:auto; }
  .badge { display:inline-block; margin-top:26px; padding:5px 12px; border-radius:999px;
    border:1px solid var(--yellow); color:var(--yellow); font-size:.8rem; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; }
  h1 { font-size:clamp(1.7rem,6vw,2.5rem); line-height:1.15; margin:14px 0 12px; }
  .lead { font-size:1.1rem; margin:0 0 10px; }
  .sub { color:var(--muted); margin:0; font-size:.98rem; }
  footer { padding:18px 22px 22px; text-align:center; color:var(--muted); font-size:.85rem; }
  footer a { color:var(--muted); text-decoration:none; border-bottom:1px solid #444; }
  footer a:hover, footer a:focus { color:var(--yellow); border-color:var(--yellow); }
</style>
</head>
<body>
  <div class="checker" aria-hidden="true"></div>
  <div class="checker b" aria-hidden="true"></div>
  <main>
    <img class="logo" src="/assets/logo-320.webp" width="320" height="259" alt="TaxiKit">
    <span class="badge">Kommer snart</span>
    <h1>Butiken är under uppbyggnad</h1>
    <p class="lead">Snart öppnar här en butik för en taxichaufförs alla behov.</p>
    <p class="sub">Smarta saker för bilen och passet – som korthållare, laddare, mobilhållare och sånt som håller ordning i bilen.</p>
  </main>
  <footer>
    © TaxiKit · <a href="/TaxiData/">Förarappen TaxiData →</a>
  </footer>
</body>
</html>
