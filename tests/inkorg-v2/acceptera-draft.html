<!doctype html><meta charset="utf-8"><title>Acceptera draft test</title>
<div id="host"></div>
<script>
window.ARENDE={
  esc:function(x){return String(x??'').replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});},
  errText:function(e){return (e&&e.message)||'fel';},
  rpc:function(name,p){
    if(name!=='mailbox_v2')return Promise.resolve({items:[]});
    var action=p.p_action,data=p.p_data||{};
    window.__calls=(window.__calls||[]).concat([{action:action,data:data}]);
    if(action==='decide')return new Promise(function(r){setTimeout(function(){
      var b=window.__thread.bookings[0];
      b.status=data.decision==='accepted'?'accepted':'declined';
      b.decided_at=new Date().toISOString();
      if(data.decision==='declined'&&data.reason){b.reason=data.reason;window.__thread.messages.push({mine:true,role:'driver',body:data.reason,at:b.decided_at});}
      r({id:10});
    },40);});
    if(action==='get')return new Promise(function(r){setTimeout(function(){r(JSON.parse(JSON.stringify(window.__thread)));},40);});
    if(action==='mark_read'||action==='item_flags'||action==='list')return Promise.resolve(action==='list'||action==='item_flags'?[]:{});
    if(action==='mailbox_capabilities')return Promise.resolve({});
    if(action==='reply')return new Promise(function(r){setTimeout(function(){window.__thread.messages.push({mine:true,role:'driver',body:data.body,at:new Date().toISOString()});r({id:10});},40);});
    return Promise.resolve([]);
  },
  view:function(){return '';},
  mountCertificates:function(){}
};
window.__thread={id:10,subject:'Testtråd',locked:false,is_driver:true,car_number:'',messages:[{mine:false,role:'admin',body:'Hej',at:'2026-11-09T10:00:00Z'}],bookings:[{id:50,status:'pending_driver',title:'Bokad tid',kind:'Bokad tid',starts_at:'2026-11-11T10:00:00Z',created_at:'2026-11-09T10:00:00Z',car_number:''}]};
</script>
<script src="../../TaxiData/mailbox-ui.js"></script>
<script>
const u=MAILBOX.create(false,'INKORG');
window.INKORG=u;
u.render(document.getElementById('host'));
u.openThread(10);
</script>
