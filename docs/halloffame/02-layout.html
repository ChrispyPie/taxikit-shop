<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=390"/>
<title>Topplistor layout-mock</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8f1f8;--surface:#fff;--text:#1a365d;--text-soft:#4a5568;--muted:#718096;
  --primary:#1a365d;--on-primary:#fff;--border:#cbd5e0;--border-soft:#d0e0ea;--du:#fef3c7;
}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:var(--text)}
.phone{width:390px;min-height:844px;margin:0 auto;background:var(--bg);overflow:hidden;position:relative}
header{background:var(--bg);color:var(--primary);padding:0.8rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-soft)}
header h1{font-size:1.1rem}
.ex{background:#fefcbf;color:#975a16;font-size:11px;font-weight:700;text-align:center;padding:6px 10px;border-bottom:1px solid #f6e05e}
.wrap{padding:0.75rem 0.75rem 1.2rem}
/* tvålägesväljare */
.mode{display:flex;gap:0;margin-bottom:0.7rem;border:2px solid var(--primary);border-radius:12px;overflow:hidden;background:var(--surface)}
.mode button{flex:1;border:none;background:transparent;color:var(--primary);padding:0.55rem 0.4rem;font-size:0.95rem;font-weight:600;cursor:default}
.mode button.on{background:var(--primary);color:var(--on-primary)}
/* Förare/Bil */
.who{display:flex;justify-content:center;gap:0.4rem;margin-bottom:0.7rem}
.who .tab{padding:0.4rem 1.1rem;border:2px solid var(--primary);border-radius:20px;background:var(--surface);color:var(--primary);font-size:0.88rem;font-weight:500}
.who .tab.on{background:var(--primary);color:var(--on-primary)}
.who.hidden{display:none}
/* dropdown */
.sel-wrap{position:relative;margin-bottom:0.55rem}
.sel{width:100%;appearance:none;-webkit-appearance:none;background:var(--surface);border:2px solid var(--primary);border-radius:10px;padding:0.65rem 2.2rem 0.65rem 0.85rem;font-size:0.95rem;font-weight:600;color:var(--primary);text-align:left}
.sel::after,.chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--primary);font-size:1.1rem}
.chev{content:'▾'}
.menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:2px solid var(--primary);border-radius:10px;z-index:5;box-shadow:0 8px 24px rgba(26,54,93,.18);max-height:320px;overflow:auto}
.menu.open{display:block}
.menu .opt{padding:0.7rem 0.85rem;font-size:0.92rem;color:var(--text);border-top:1px solid var(--border-soft)}
.menu .opt:first-child{border-top:none}
.menu .opt.on{background:#ebf8ff;font-weight:700;color:var(--primary)}
.menu .opt small{display:block;font-size:0.72rem;color:var(--muted);font-weight:400;margin-top:2px}
.info{font-size:0.78rem;color:var(--muted);text-align:center;margin:0 0 0.6rem;line-height:1.35}
.card{background:var(--surface);border-radius:12px;padding:0.55rem 0.65rem}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:0.25rem}
.title{font-weight:700;color:var(--primary);font-size:0.95rem}
.me{font-size:0.75rem;color:var(--text-soft);white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-top:1px solid var(--border-soft);font-size:0.92rem}
.row.du{background:var(--du);border-radius:8px;font-weight:700;border-top-color:transparent;margin-top:2px}
.pos{width:2rem;text-align:center;flex-shrink:0}
.who2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val{font-variant-numeric:tabular-nums;white-space:nowrap}
.when{font-size:0.7rem;color:var(--muted);font-weight:400;margin-left:4px}
.badge{display:inline-block;font-size:0.65rem;background:#d69e2e;color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px;font-weight:700;vertical-align:middle}
.period{display:flex;justify-content:center;gap:0.35rem;margin-bottom:0.65rem}
.period .p{padding:0.35rem 0.85rem;border:2px solid var(--primary);border-radius:16px;background:var(--surface);color:var(--primary);font-size:0.8rem}
.period .p.on{background:var(--primary);color:var(--on-primary);font-weight:600}
.date{display:flex;align-items:center;justify-content:center;gap:0.35rem;margin-bottom:0.55rem}
.date .b{width:38px;height:38px;border:2px solid var(--primary);border-radius:10px;background:var(--surface);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.date .d{min-width:120px;padding:0.5rem 0.9rem;border:2px solid var(--primary);border-radius:10px;background:var(--surface);color:var(--primary);text-align:center;font-weight:500;font-size:0.9rem}
.foot{font-size:0.72rem;color:var(--muted);text-align:center;margin-top:0.7rem}
.scrim{display:none;position:absolute;inset:0;background:rgba(15,23,42,.15);z-index:4}
.scrim.on{display:block}
</style>
</head>
<body>
<!-- VIEW is set via ?v=rekord|rekord-open|topplista -->
<div class="phone" id="phone"></div>
<script>
const params = new URLSearchParams(location.search);
const view = params.get('v') || 'rekord';

const REKORD_OPTS = [
  {k:'langst', t:'Längsta körningen', sub:'km · personligt bästa'},
  {k:'inkort', t:'Mest inkört på en månad', sub:'kr · personligt bästa'},
  {k:'dricks', t:'Mest dricks på en månad', sub:'kr · personligt bästa'},
  {k:'pass', t:'Flest körningar på ett pass', sub:'st · personligt bästa'},
  {k:'kort', t:'Kortaste körningen', sub:'km · personligt bästa'},
  {k:'langpass', t:'Längsta passet', sub:'tid · personligt bästa'},
  {k:'natt', t:'Flest km på ett nattpass', sub:'km · personligt bästa'},
  {k:'belopp', t:'Högsta enskilda beloppet', sub:'kr · personligt bästa'},
  {k:'flyg', t:'Flest flygresor på ett pass', sub:'st · Landvetter-zoner'},
];
const TOPP_OPTS = [
  {k:'inkort', t:'Mest inkört', sub:'kr · vald period'},
  {k:'dricks', t:'Mest dricks', sub:'kr · vald period'},
  {k:'krmil', t:'Bäst kr/mil', sub:'kr · vald period'},
  {k:'krtimme', t:'Bäst kr/timme', sub:'kr · vald period'},
  {k:'antal', t:'Flest körningar', sub:'st · vald period'},
  {k:'snitt', t:'Högst snitt per körning', sub:'kr · vald period'},
  {k:'perskift', t:'Högst snitt per pass', sub:'kr · vald period'},
  {k:'verkstad', t:'Flest verkstadstimmar', sub:'tid · vald period'},
];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));}

function rowsRekord(){
  return `
    <div class="row"><span class="pos">🥇</span><span class="who2">Förare</span><span class="val">312 km<span class="when">· mar -26</span></span></div>
    <div class="row"><span class="pos">🥈</span><span class="who2">Förare</span><span class="val">298 km<span class="when">· jun -26</span></span></div>
    <div class="row"><span class="pos">🥉</span><span class="who2">Förare</span><span class="val">291 km<span class="when">· okt -25</span></span></div>
    <div class="row du"><span class="pos">4</span><span class="who2">Du</span><span class="val">287 km<span class="when">· apr -26</span></span></div>
    <div class="row"><span class="pos">5</span><span class="who2">Förare</span><span class="val">241 km<span class="when">· maj -26</span></span></div>
    <div class="row"><span class="pos">6</span><span class="who2">Förare</span><span class="val">228 km<span class="when">· sep -25</span></span></div>
    <div class="row"><span class="pos">7</span><span class="who2">Förare</span><span class="val">210 km<span class="when">· feb -26</span></span></div>
    <div class="row"><span class="pos">8</span><span class="who2">Förare</span><span class="val">198 km<span class="when">· jul -26</span></span></div>`;
}
function rowsTopp(){
  return `
    <div class="row"><span class="pos">🥇</span><span class="who2">Förare</span><span class="val">18 420 kr</span></div>
    <div class="row"><span class="pos">🥈</span><span class="who2">Förare</span><span class="val">16 850 kr</span></div>
    <div class="row du"><span class="pos">3</span><span class="who2">Du</span><span class="val">15 210 kr</span></div>
    <div class="row"><span class="pos">4</span><span class="who2">Förare</span><span class="val">14 100 kr</span></div>
    <div class="row"><span class="pos">5</span><span class="who2">Förare</span><span class="val">13 640 kr</span></div>
    <div class="row"><span class="pos">6</span><span class="who2">Förare</span><span class="val">12 900 kr</span></div>
    <div class="row"><span class="pos">7</span><span class="who2">Förare</span><span class="val">11 750 kr</span></div>
    <div class="row"><span class="pos">8</span><span class="who2">Förare</span><span class="val">10 880 kr</span></div>`;
}

const isRekord = view.startsWith('rekord');
const open = view === 'rekord-open';
const opts = isRekord ? REKORD_OPTS : TOPP_OPTS;
const chosen = opts[0];
const heading = isRekord ? '🏅 Rekordtavlan' : '🏆 Topplistor';

const menu = opts.map((o,i)=>`<div class="opt${i===0?' on':''}">${esc(o.t)}<small>${esc(o.sub)}</small></div>`).join('');

const whoBlock = isRekord ? '' : `
  <div class="who">
    <div class="tab on">👤 Förare</div>
    <div class="tab">🚕 Bil</div>
  </div>`;

const periodBlock = isRekord ? '' : `
  <div class="period">
    <div class="p">Dag</div><div class="p">Vecka</div><div class="p on">Månad</div><div class="p">År</div>
  </div>
  <div class="date"><div class="b">‹</div><div class="d">Okt -26</div><div class="b">›</div><div class="b">»</div></div>`;

const info = isRekord
  ? 'Personliga bästa sedan jan 2025. Andra syns utan namn. Bilnummer visas aldrig.'
  : '21 förare med pass den här månaden. Bara din egen rad visas som "Du".';

const meLine = isRekord ? 'Du: plats 4 av 23 · 287 km' : 'Du: plats 3 av 21';
const badge = '';

document.getElementById('phone').innerHTML = `
  <header><h1>${heading}</h1><span style="font-size:0.8rem;opacity:.7">⋯</span></header>
  <div class="ex">EXEMPELDATA — inte riktiga siffror. Inget är live.</div>
  <div class="wrap">
    <div class="mode">
      <button class="${isRekord?'':'on'}">Topplista</button>
      <button class="${isRekord?'on':''}">Rekord</button>
    </div>
    ${whoBlock}
    ${periodBlock}
    <div class="sel-wrap">
      <button type="button" class="sel" id="sel">${esc(chosen.t)}</button>
      <span class="chev">▾</span>
      <div class="menu${open?' open':''}" id="menu">${menu}</div>
    </div>
    <div class="info">${info}</div>
    <div class="card">
      <div class="head"><span class="title">${esc(chosen.t)}</span><span class="me">${meLine}</span></div>
      ${isRekord ? rowsRekord() : rowsTopp()}
    </div>
    <p class="foot">${isRekord ? 'Äldre år (före 2025) kan läggas till senare om ni vill.' : 'Välj lista i rutan ovan — ingen lång scroll.'}</p>
  </div>
  <div class="scrim${open?' on':''}"></div>
`;
</script>
</body>
</html>
