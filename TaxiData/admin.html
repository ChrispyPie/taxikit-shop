<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – TaxiData</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #e8f1f8; color: #1a365d; }
    header { background: #e8f1f8; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #d0e0ea; }
    header h1 { font-size: 18px; flex: 1; text-align: center; }
    button { background: white; border: 2px solid #1a365d; color: #1a365d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    #content { padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px; }
    .icon { background: white; border: 1px solid #cbd5e0; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; }
    .icon .emoji { font-size: 32px; margin-bottom: 8px; }
    .icon .label { font-size: 13px; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: white; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    .breadcrumb span { cursor: pointer; color: #3182ce; }
    .breadcrumb .sep { color: #a0aec0; }
    .category-header { font-size: 20px; font-weight: 600; padding: 16px 16px 4px; }
    .period-display { font-size: 14px; color: #4a5568; padding: 0 16px 8px; }
    .controls { padding: 8px 16px; background: #f7fafc; border-bottom: 1px solid #e2e8f0; display: flex; gap: 8px; align-items: center; }
    .controls select { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e0; }
    .controls button { padding: 8px 12px; }
    .section { background: white; border-radius: 12px; margin: 16px; }
    .section-header { font-size: 12px; font-weight: 600; color: #718096; padding: 8px 16px; background: #f7fafc; }
    .row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #edf2f7; cursor: pointer; }
    .row:hover { background: #f7fafc; }
    .row:last-child { border-bottom: none; }
    .row.expandable { cursor: pointer; }
    .row .expand-icon { margin-right: 8px; font-size: 12px; color: #718096; }
    .sub-row { padding-left: 32px; background: #f7fafc; }
    .sub-sub-row { padding-left: 48px; background: #edf2f7; }
    .driver-detail { padding-left: 64px; background: #e2e8f0; font-size: 13px; }
    .driver-detail .label { font-weight: 400; }
    .trip-row { padding-left: 64px; background: #f7fafc; font-size: 12px; }
    .detail-row { padding-left: 80px; background: #edf2f7; font-size: 12px; }
    .trip-detail { padding-left: 80px; background: #e2e8f0; font-size: 11px; }
    .row .label { flex: 1; font-weight: 500; }
    .row .value { font-weight: 600; }
    .row.total { background: #f7fafc; font-weight: 600; }
    .hidden { display: none !important; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: white; border-radius: 12px; padding: 16px; width: 90%; max-width: 320px; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .calendar .day { padding: 8px 4px; border-radius: 4px; cursor: pointer; }
    .calendar .day:hover { background: #e2e8f0; }
    .calendar .day.selected { background: #1a365d; color: white; }
    .calendar .day.in-range { background: #bee3f8; }
    .calendar .header { font-weight: 600; font-size: 12px; padding: 4px; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 16px; }
    .modal-buttons button { flex: 1; }
    .status { font-size: 11px; padding: 2px 6px; border-radius: 10px; margin-left: 8px; }
    .status-active { background: #c6f6d5; color: #276749; }
    .status-inactive { background: #fed7d7; color: #c53030; }
    .status-pending { background: #fefcbf; color: #975a16; }
    .acct-info { font-size: 13px; color: #4a5568; margin-top: 12px; line-height: 1.5; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #4a5568; }
    .form-group label.radio-l { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #1a365d; margin: 6px 0; }
    .form-group label.radio-l input { width: 20px; height: 20px; margin: 0; }
    .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; background: white; box-sizing: border-box; }
    .fuel-own { background: #fefcbf; color: #744210; padding: 0 4px; border-radius: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; }
    .form-group textarea { min-height: 60px; resize: vertical; }
    .form-group input:disabled, .form-group textarea:disabled, .form-group select:disabled { background: #edf2f7; color: #a0aec0; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }
    .form-section { font-size: 14px; font-weight: 600; margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
    .info-box { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 12px; }
    .info-box h4 { margin-bottom: 8px; }
    .info-box ul { margin-left: 16px; }
    .info-box li { margin-bottom: 4px; }
    #access-denied { display: none; text-align: center; padding: 48px 16px; }
    #access-denied h2 { margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="access-denied">
    <h2>Ingen behörighet</h2>
    <p>Du har inte tillgång till admin-panelen.</p>
    <button onclick="location.href='index.html'" style="margin-top:16px;">Tillbaka</button>
  </div>

  <div id="admin-app">
    <header>
      <button onclick="goHome()" style="font-size:20px;">🏠</button>
      <h1 id="title">Admin</h1>
      <button onclick="toggleProfile()" style="font-size:20px;">👤</button>
    </header>
    <div class="profile-menu" id="profile-menu" style="display:none; position:absolute; top:60px; right:16px; background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:12px; z-index:100;">
      <div onclick="location.href='index.html'" style="padding:8px; cursor:pointer;">Förarapp</div>
      <div onclick="logout()" style="padding:8px; cursor:pointer; color:#dc2626;">Logga ut</div>
    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="server-status" class="server-status" data-show="0" data-updated="server-updated" style="display:none"></div>
    <div id="server-updated" style="display:none; text-align:center; font-size:0.8rem; color:#718096; margin-top:0.3rem;"></div>
    <div id="content"></div>
  </div>

  <script src="serverstatus.js?v=20261024v"></script>
  <script src="verkstad-admin.js?v=20261025bv2"></script>
  <script>
    const APP_VERSION = '1.0.26';
    console.log('Admin version:', APP_VERSION);
    const SUPABASE_URL = 'https://lpfdryvukqmjlgenuzpb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7LwIOZ5ygRvJqJKFxl4cNQ_LvrzrHrP';

    // serverStatus: true = vyn visar serverstatus-lampan (vyer vars data hämtas från servern).
    // Planerat: en kommande vy 'Topplistor' beror också på serverdatan – lägg då till serverStatus: true på den.
    const menu = [
      { id: 'akeridata', icon: '📊', label: 'Åkeridata', serverStatus: true },
      { id: 'bilar', icon: '🚕', label: 'Bilar' },
      { id: 'verkstad', icon: '🛠️', label: 'Bil & verkstad' },
      { id: 'chaufforer', icon: '👥', label: 'Chaufförer' },
      // Statistik borttagen 2026-10-25 (tom platshållare): { id: 'statistik', icon: '📈', label: 'Statistik' },
      
    ];

    const catLabels = { inkort: 'Inkört', timmar: 'Timmar', km: 'Km', chauffor: 'Chaufför', bil: 'Bil' };
    const userCategories = { superadmin: 'Superadmin', agare: 'Ägare', admin: 'Admin', standard: 'Standard', semester: 'Semester', avslutad: 'Avslutad' };
    const catOrder = ['superadmin', 'agare', 'admin', 'standard', 'semester', 'avslutad'];
    const days = ['sö', 'må', 'ti', 'on', 'to', 'fr', 'lö'];
    const months = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

    let data = { trips: [], shifts: [] };
    let loadedMonths = {};
    let drivers = {};
    let extraIds = new Set();
    let path = [];
    localStorage.removeItem('admin_path');
    let category = localStorage.getItem('admin_category') || 'inkort';
    let periodStart = new Date();
    periodStart.setDate(periodStart.getDate() - 1);
    let periodEnd = new Date();
    periodEnd.setDate(periodEnd.getDate() - 1);
    let tempStart = null;
    let tempEnd = null;
    let calMonth = new Date();
    let editingDriver = localStorage.getItem('admin_editing') || null;
    let currentUserId = localStorage.getItem('taxi_driver') || '';
    let expandedDays = {};
    let expandedCars = {};
    let expandedDrivers = {};
    let expandedCategories = {};
    let expandedTrips = {};
    let showLog = false;
    let carList = null;        // Bilar: { can_edit, cars: [...] } från servern
    let editingCar = null;     // null, 'new' eller bilens id
    let selectedDay = null, selectedCar = null;
    let logEntries = null;
    const lastLinks = {};   // aktiveringslänkar som skapats i den här sessionen (bara i minnet)

    function getMyCategory() {
      const me = drivers[currentUserId];
      return me ? me.category : '';
    }

    function isOwner() {
      return getMyCategory() === 'agare';
    }

    // Åkeridata och Bilar (hela åkeriets data) är för ägaren. Bara ägaren kan ändra bilar.
    // TILLFÄLLIGT under utvecklingen får även S admin se den (utan förar-id). Ta bort 'superadmin' här
    // och i private.company_view_roles() på servern för att stänga. Admin har aldrig åtkomst.
    const AKERI_EXTRA_ROLES = ['superadmin'];
    function canSeeAkeridata() {
      return isOwner() || AKERI_EXTRA_ROLES.includes(getMyCategory());
    }

    const COMPANY_VIEWS = ['akeridata', 'bilar', 'verkstad'];

    function isSuperAdmin() {
      return getMyCategory() === 'superadmin';
    }

    function hasAdminAccess() {
      const cat = getMyCategory();
      return cat === 'admin' || cat === 'agare' || cat === 'superadmin';
    }

    // S admin-kontot är skyddat (även på servern): ingen annan kan ändra, avaktivera eller nollställa det,
    // och ingen kan ge rollen S admin via appen.
    function isProtectedSadmin(id) {
      return normCategory(drivers[id]?.category) === 'superadmin' && id !== currentUserId;
    }

    function canEditCategory(targetCat) {
      const myCat = getMyCategory();
      if (targetCat === 'superadmin') return false;
      if (myCat === 'superadmin') return true;
      if (myCat === 'agare') return targetCat !== 'superadmin';
      if (myCat === 'admin') return ['standard', 'semester', 'avslutad'].includes(targetCat);
      return false;
    }

    function getAllowedCategories() {
      const myCat = getMyCategory();
      if (myCat === 'superadmin') return Object.entries(userCategories).filter(([k]) => k !== 'superadmin');
      if (myCat === 'agare') return Object.entries(userCategories).filter(([k]) => k !== 'superadmin');
      if (myCat === 'admin') return Object.entries(userCategories).filter(([k]) => ['standard', 'semester', 'avslutad'].includes(k));
      return [];
    }

    function maskValue(val) {
      if (!val) return '';
      return '••••••••';
    }

    function toYMD(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function getMonthsInPeriod() {
      const months = [];
      const start = new Date(periodStart);
      const end = new Date(periodEnd);
      let current = new Date(start.getFullYear(), start.getMonth(), 1);
      while (current <= end) {
        const ym = current.getFullYear() + '-' + String(current.getMonth() + 1).padStart(2, '0');
        months.push(ym);
        current.setMonth(current.getMonth() + 1);
      }
      return months;
    }

    // Admin-sidan hämtar ingen resdata längre: förarlistan kommer från servern (admin_list_drivers),
    // och resdata per förare visas bara för ägaren (i Körpassdata/Åkeridata).

    // Alla läsningar/ändringar av förare går via server-funktioner (RPC)
    // som kontrollerar inloggningen och behörigheten på servern.
    function getToken() { return localStorage.getItem('taxi_session') || ''; }

    async function rpc(name, args = {}) {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_token: getToken(), ...args })
      });
      const text = await res.text();
      const body = text ? JSON.parse(text) : null;
      if (!res.ok) {
        const err = new Error((body && body.message) || ('HTTP ' + res.status));
        err.code = body && body.code;
        if (err.code === '28000') {
          ['taxi_session', 'taxi_logged_in', 'taxi_driver', 'taxi_view'].forEach(k => localStorage.removeItem(k));
          location.href = 'index.html';
        }
        throw err;
      }
      return body;
    }

    const errorTexts = {
      forbidden: 'Du har inte behörighet att göra det.',
      forbidden_self: 'Du kan inte ändra din egen aktivering.',
      no_password: 'Föraren har inget lösenord än.',
      sadmin_protected: 'S admin-kontot är skyddat. Det kan inte ändras, avaktiveras eller nollställas av någon annan.',
      sadmin_grant: 'Rollen S admin kan inte ges i appen.',
      password_too_short: 'Lösenordet måste vara minst 6 tecken.',
      not_pending: 'Föraren har redan valt lösenord. Avaktivera och aktivera igen för en ny länk.',
      bad_id: 'Ogiltigt förar-ID.',
      invalid_car: 'Kontrollera fälten (bilnummer, bilmodell, minst en kategori, drivmedel och förbrukning eller kr/mil 0–1000).',
      invalid_price: 'Kontrollera priserna (tal större än 0, påslag 0–20 kr/kWh, laddning 0–100 %).',
      duplicate_car: 'Det finns redan en bil med det bilnumret.',
      not_found: 'Bilen finns inte längre.',
      bad_status: 'Ogiltigt beslut.'
    };
    function errText(e) { return errorTexts[e.message] || ('Fel: ' + e.message); }

    async function reloadDrivers() {
      const rows = await rpc('admin_list_drivers');
      drivers = {};
      extraIds = new Set();
      // registered === false: förar-id som bara finns i resdatan (inte upplagd ännu)
      if (Array.isArray(rows)) rows.forEach(r => { if (r.registered === false) extraIds.add(r.id); else drivers[r.id] = r; });
    }

    async function loadData() {
      if (!currentUserId) {
        location.href = 'index.html';
        return;
      }
      if (!getToken()) {
        location.href = 'index.html';
        return;
      }
      // Måste föraren välja nytt lösenord? Då gäller det först (sköts i index.html)
      try { const me = await rpc('get_me'); if (me && me.must_change_password) { location.href = 'index.html'; return; } } catch (e) {}
      let denied = false;
      try {
        await reloadDrivers();
      } catch (e) { console.error(e); denied = true; }

      if (denied || !hasAdminAccess()) {
        document.getElementById('access-denied').style.display = 'block';
        document.getElementById('admin-app').style.display = 'none';
        return;
      }
      // admin.html#bilar öppnar Bilar direkt (länk från Åkeridata)
      if (location.hash === '#bilar' && canSeeAkeridata()) { history.replaceState(null, '', location.pathname); openMenu('bilar'); return; }
      // admin.html#verkstad öppnar Bil & verkstad (verkstadstimmar) direkt (länk från förarappen)
      if (location.hash === '#verkstad' && canSeeAkeridata()) { history.replaceState(null, '', location.pathname); openMenu('verkstad'); return; }
      render();
      // Antal verkstadstider som väntar på beslut visas på rutan
      if (canSeeAkeridata()) VERKSTAD_ADMIN.count().then(() => { if (!path.length) render(); });
    }

    function saveState() {
      localStorage.setItem('admin_path', JSON.stringify(path));
      localStorage.setItem('admin_category', category);
      localStorage.setItem('admin_editing', editingDriver || '');
    }

    function formatSEK(n) {
      return new Intl.NumberFormat('sv-SE').format(Math.round(n || 0)) + ' kr';
    }

    function parseAmount(str) {
      return parseFloat((str || '0').replace(/\s/g, '').replace(',', '.')) || 0;
    }

    function formatDate(d) {
      return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
    }

    function getDisplayName(id) {
      const d = drivers[id];
      if (!d) return id;
      if (!isOwner()) return id;
      const first = d.first_name || '';
      const last = d.last_name || '';
      if (!first && !last) return id;
      if (!last) return first;
      return first + ' ' + last[0];
    }

    function inPeriod(dateStr) {
      if (!dateStr) return false;
      const ymd = dateStr.slice(0, 10);
      const startYMD = toYMD(periodStart);
      const endYMD = toYMD(periodEnd);
      return ymd >= startYMD && ymd <= endYMD;
    }

    function getTrips() {
      return (data.trips || []).filter(t => inPeriod(t.startdatum) && t.kredittyp !== '999');
    }

    function getAllDriverIds() {
      const ids = new Set(extraIds);
      Object.keys(drivers).forEach(id => ids.add(id));
      return Array.from(ids);
    }

    // Aktiv = activated i databasen. Ingen automatisk avaktivering
    // (tidigare blev alla "Inaktiv" när 24h-fristen i expiry hade passerat).
    const statusLabels = { active: 'Aktiv', pending: 'Väntar', inactive: 'Inaktiv' };

    function fmtWhen(t) {
      if (!t) return '';
      return new Date(t).toLocaleString('sv-SE', { timeZone: 'Europe/Stockholm', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function getDriverStatus(id) {
      const d = drivers[id];
      if (d && d.activated === true) return d.pending ? 'pending' : 'active';
      return 'inactive';
    }

    // Giltig kategori, annars standard (t.ex. gamla 'normal' eller tom)
    function normCategory(cat) {
      return catOrder.includes(cat) ? cat : 'standard';
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      const back = document.getElementById('back');
      if (path.length === 0) {
        bc.innerHTML = '';
        return;
      }
      let html = '<span onclick="goHome()">Hem</span>';
      path.forEach((p, i) => {
        html += '<span class="sep">›</span>';
        if (i < path.length - 1) {
          html += `<span onclick="goTo(${i})">${p.label}</span>`;
        } else {
          html += `<span>${p.label}</span>`;
        }
      });
      bc.innerHTML = html;
    }

    function toggleDay(ymd) {
      expandedDays[ymd] = !expandedDays[ymd];
      render();
    }

    function toggleCar(ymd, car) {
      const key = ymd + '_' + car;
      expandedCars[key] = !expandedCars[key];
      render();
    }

    function toggleDriver(ymd, car, driver) {
      const key = ymd + '_' + car + '_' + driver;
      expandedDrivers[key] = !expandedDrivers[key];
      render();
    }

    function toggleCategory(key) {
      expandedCategories[key] = !expandedCategories[key];
      render();
    }

    function toggleTrip(key) {
      expandedTrips[key] = !expandedTrips[key];
      render();
    }

    function render() {
      saveState();
      renderBreadcrumb();
      const view = path.length ? menu.find(m => m.id === path[0].id) : null;
      if (window.setServerStatusVisible) setServerStatusVisible('server-status', !!(view && view.serverStatus));
      const content = document.getElementById('content');
      const title = document.getElementById('title');

      if (path.length === 0) {
        title.textContent = 'Admin';
        content.innerHTML = `<div class="grid">${menu.filter(m => !COMPANY_VIEWS.includes(m.id) || canSeeAkeridata()).map(m => `
          <div class="icon" onclick="${m.id === 'forarapp' ? "location.href='index.html'" : "openMenu('" + m.id + "')"}">
            <div class="emoji">${m.icon}</div>
            <div class="label">${m.label}</div>${m.id === 'verkstad' ? VERKSTAD_ADMIN.badge() : ''}
          </div>
        `).join('')}</div>`;
      } else if (path[0].id === 'akeridata') {
        // Åkeridata är en egen sida med samma uppbyggnad som Körpassdata
        location.href = 'akeridata.html';
        return;
      } else if (path[0].id === 'bilar') {
        title.textContent = editingCar ? (editingCar === 'fuel' ? 'Drivmedelspriser' : editingCar === 'new' ? 'Ny bil' : 'Ändra bil') : 'Bilar';
        if (!canSeeAkeridata()) content.innerHTML = '<div class="section"><p style="padding:16px;">Ingen behörighet</p></div>';
        else if (editingCar) renderEditCar(content);
        else renderCars(content);
      } else if (path[0].id === 'verkstad') {
        title.textContent = 'Bil & verkstad';
        if (!canSeeAkeridata()) content.innerHTML = '<div class="section"><p style="padding:16px;">Ingen behörighet</p></div>';
        else VERKSTAD_ADMIN.render(content);
      } else if (path[0].id === 'chaufforer') {
        if (showLog) {
          title.textContent = 'Logg';
          renderLog(content);
        } else if (editingDriver) {
          title.textContent = 'Redigera';
          renderEditDriver(content);
        } else {
          title.textContent = 'Chaufförer';
          renderChaufforer(content);
        }
      } else {
        title.textContent = path[0].label;
        content.innerHTML = '<div class="section"><p style="padding:16px;">Kommer snart</p></div>';
      }
    }

    function renderChaufforer(content) {
      const ids = getAllDriverIds();
      const grouped = {};
      const unknown = [];
      ids.forEach(id => {
        const cat = normCategory(drivers[id]?.category);
        if (!catOrder.includes(cat)) {
          unknown.push(id);
        } else {
          if (!grouped[cat]) grouped[cat] = [];
          grouped[cat].push(id);
        }
      });

      let html = '<div style="text-align:right; padding:4px 16px 8px;"><a href="#" onclick="openLog();return false;" style="font-size:13px; color:#3182ce;">Logg</a></div>';
      html += '<div class="section">';
      catOrder.forEach(cat => {
        if (!grouped[cat] || grouped[cat].length === 0) return;
        html += `<div class="section-header">${userCategories[cat]}</div>`;
        grouped[cat].sort().forEach(id => {
          const status = getDriverStatus(id);
          const statusLabel = statusLabels[status];
          const displayName = getDisplayName(id);
          html += `<div class="row" onclick="editDriver('${id}')">
            <span class="label">${displayName}</span>
            <span class="status status-${status}">${statusLabel}</span>
          </div>`;
        });
      });
      if (unknown.length > 0) {
        html += `<div class="section-header">Övriga</div>`;
        unknown.sort().forEach(id => {
          const status = getDriverStatus(id);
          const statusLabel = statusLabels[status];
          const displayName = getDisplayName(id);
          html += `<div class="row" onclick="editDriver('${id}')">
            <span class="label">${displayName}</span>
            <span class="status status-${status}">${statusLabel}</span>
          </div>`;
        });
      }
      html += '</div>';
      content.innerHTML = html;
    }

        <div class="form-group"><label>Anteckningar</label><textarea id="f-notes" ${personalDisabled}>${owner ? (d.notes || '') : maskValue(d.notes)}</textarea></div>
        
        <div class="info-box">
          <h4>Rättigheter</h4>
          <ul>
            <li><b>Avslutad:</b> Kan ej logga in. Data används för statistik.</li>
            <li><b>Semester:</b> Kan logga in, se data. Inga notiser.</li>

        </div>
        
        ${sadminLocked ? `<div class="info-box" style="margin-top:16px;"><h4>🔒 Skyddat konto</h4><p style="margin:4px 0 0;">S admin-kontot kan inte ändras, avaktiveras eller nollställas av någon annan. Bara S admin själv kan ändra sitt konto.</p></div>` : ''}
        ${!sadminLocked && (owner || canEdit) ? `<button onclick="saveDriver()" style="width:100%; margin-top:16px;">Spara</button>` : ''}
        <div style="margin-top:16px; display:flex; gap:8px;">
          ${canToggle ? `<button onclick="toggleActive('${editingDriver}')" style="flex:1;">${isActive ? 'Avaktivera' : 'Aktivera'}</button>` : ''}
          <button onclick="shareDriver('${editingDriver}')" style="flex:1;">${status === 'pending' && canToggle ? 'Aktiveringslänk' : 'Dela'}</button>

        <div class="acct-info">${status === 'pending'
          ? 'Väntar på att föraren öppnar aktiveringslänken och väljer lösenord.' + (d.link_expires_at ? ' Länken går ut ' + fmtWhen(d.link_expires_at) + '.' : ' Länken har gått ut – skapa en ny.')
          : status === 'active'
            ? (d.last_login_at ? 'Senast inloggad: ' + fmtWhen(d.last_login_at) + '. ' : '') + 'Avaktiveras automatiskt efter 30 dagar utan inloggning' + (['agare', 'superadmin'].includes(targetCat) ? ' (gäller inte ägare/superadmin).' : '.')

    function editDriver(id) {
      editingDriver = id;
      render();
    }

    async function saveDriver() {
      const d = drivers[editingDriver] || {};
      const owner = isOwner();
      const canEdit = canEditCategory(normCategory(d.category));
      if (isProtectedSadmin(editingDriver)) { alert(errorTexts.sadmin_protected); return; }
      if (!owner && !canEdit) return;

      const driverData = { id: editingDriver };
      if (owner) {
        driverData.first_name = document.getElementById('f-first-name').value;
        driverData.last_name = document.getElementById('f-last-name').value;
        driverData.address = document.getElementById('f-address').value;
        driverData.postal_code = document.getElementById('f-postal').value;
        driverData.city = document.getElementById('f-city').value;
        driverData.email = document.getElementById('f-email').value;
        driverData.phone = document.getElementById('f-phone').value;
        driverData.emergency_first_name = document.getElementById('f-emergency-first').value;
        driverData.emergency_last_name = document.getElementById('f-emergency-last').value;
        driverData.emergency_address = document.getElementById('f-emergency-address').value;
        driverData.emergency_postal = document.getElementById('f-emergency-postal').value;
        driverData.emergency_city = document.getElementById('f-emergency-city').value;
        driverData.emergency_phone = document.getElementById('f-emergency-phone').value;
        driverData.emergency_relation = document.getElementById('f-emergency-relation').value;
        driverData.notes = document.getElementById('f-notes').value;
      }
      if (canEdit) {
        driverData.category = document.getElementById('f-category').value;
      }

      const { id: _ignored, ...fields } = driverData;
      try {
        await rpc('admin_save_driver', { p_id: editingDriver, p_data: fields });
        await reloadDrivers();
        alert('Sparat!');
        editingDriver = null;
        render();
      } catch (e) {
        alert(errText(e));
      }
    }

    // Endast admin, ägare och superadmin får aktivera/avaktivera,
    // och bara chaufförer vars kategori de får ändra. Man kan inte avaktivera sig själv.
    function canToggleDriver(id) {
      if (!hasAdminAccess()) return false;
      if (id === currentUserId) return false;
      if (isProtectedSadmin(id)) return false;
      return canEditCategory(normCategory(drivers[id]?.category));
    }

    async function toggleActive(id) {
      if (!canToggleDriver(id)) { alert('Du har inte behörighet att ändra den här chauffören.'); return; }
      if (getDriverStatus(id) !== 'inactive') {
        await deactivateDriver(id);
      } else {
        await activateDriver(id);
      }
    }

    async function activateDriver(id) {
      // Kategori: det som valts i listan, annars Standard
      const stored = drivers[id]?.category;
      const sel = document.getElementById('f-category');
      let cat = (sel && !sel.disabled) ? sel.value : normCategory(stored);
      if (!catOrder.includes(cat)) cat = 'standard';
      // Avslutad kan inte logga in – om ingen annan kategori valts blir det Standard
      if (cat === 'avslutad' && (!sel || sel.value === normCategory(stored))) cat = 'standard';
      if (!canEditCategory(cat)) cat = 'standard';
      if (!confirm('Aktivera ' + id + ' som ' + (userCategories[cat] || cat) + '?\n\nDu får en aktiveringslänk (gäller i 7 dagar) som du skickar till föraren. Föraren väljer själv sitt lösenord.')) return;

      try {
        // Servern skapar en engångslänk; inget lösenord skapas eller visas
        const r = await rpc('admin_activate', { p_id: id, p_category: cat });
        if (!r || !r.ok || !r.link_token) { alert('Fel: aktiveringen sparades inte korrekt. Försök igen.'); return; }
        lastLinks[id] = { url: activationUrl(r.link_token), expires: r.expires_at };
        await reloadDrivers();
        render();
        showLinkModal(id);
      } catch (e) {
        alert(errText(e));
      }
    }

    function activationUrl(token) {
      return new URL('aktivera.html', location.href.split('#')[0]).href + '#t=' + token;
    }

    async function newActivationLink(id) {
      if (!confirm('Skapa en ny aktiveringslänk för ' + id + '? Den gamla länken slutar fungera.')) return;
      try {
        const r = await rpc('admin_new_activation_link', { p_id: id });
        lastLinks[id] = { url: activationUrl(r.link_token), expires: r.expires_at };
        await reloadDrivers();
        render();
        showLinkModal(id);
      } catch (e) {
        alert(errText(e));
      }
    }

    function linkMessage(id) {
      // Förar-ID skickas aldrig med länken: hamnar den hos fel person kan de inte aktivera kontot
      return 'TaxiData – aktivera ditt konto\n\nÖppna länken, skriv ditt förar-ID och välj ett lösenord:\n' + lastLinks[id].url +
        '\n\nLänken fungerar en gång och går ut ' + fmtWhen(lastLinks[id].expires) + '.';
    }

    function closeLinkModal() {
      const m = document.getElementById('link-modal');
      if (m) m.remove();
    }

    function showLinkModal(id) {
      closeLinkModal();
      const l = lastLinks[id];
      if (!l) return;
      const m = document.createElement('div');
      m.className = 'modal'; m.id = 'link-modal';
      m.innerHTML = `<div class="modal-box">
        <h3 style="margin:0 0 8px; color:#1a365d;">Aktiveringslänk för ${esc(id)}</h3>
        <p style="font-size:13px; color:#4a5568; margin:0 0 8px;">Skicka länken till föraren. Den fungerar en gång och går ut ${esc(fmtWhen(l.expires))}. Länken visas bara nu – annars kan du skapa en ny.<br>Förar-ID står inte i länken eller meddelandet – föraren behöver kunna sitt förar-ID för att aktivera.</p>
        <input id="link-url" readonly value="${esc(l.url)}" style="width:100%; font-size:12px; box-sizing:border-box;" onclick="this.select()">
        <div class="modal-buttons">
          <button id="link-copy" onclick="copyLink('${esc(id)}')">Kopiera</button>
          ${navigator.share ? `<button onclick="navigator.share({ title: 'TaxiData', text: linkMessage('${esc(id)}') }).catch(() => {})">Dela</button>` : ''}
        </div>
        <div class="modal-buttons" style="margin-top:8px;">
          <button onclick="closeLinkModal(); newActivationLink('${esc(id)}')">Ny länk</button>
          <button onclick="closeLinkModal()" style="background:#1a365d; color:white;">Stäng</button>
        </div>
      </div>`;
      document.body.appendChild(m);
    }

    async function copyLink(id) {
      const text = linkMessage(id);
      try { await navigator.clipboard.writeText(text); }
      catch (e) { const i = document.getElementById('link-url'); i.select(); document.execCommand('copy'); }
      const b = document.getElementById('link-copy');
      if (b) b.textContent = 'Kopierad ✓';
    }

    function shareDriver(id) {
      const status = getDriverStatus(id);
      if (status === 'pending' && canToggleDriver(id)) {
        if (lastLinks[id]) showLinkModal(id); else newActivationLink(id);
        return;
      }
      // Aktivt konto: dela bara adressen och förar-ID (lösenord visas aldrig)
      const link = new URL('./', location.href).href;
      const msg = 'TaxiData\n\nLänk: ' + link + '\nFörar-ID: ' + id + '\nLogga in med lösenordet du valde när du aktiverade kontot.';
      if (navigator.share) {
        navigator.share({ title: 'TaxiData', text: msg }).catch(() => {});
      } else {
        alert(msg);
      }
    }

    // Nollställ lösenord: föraren måste välja nytt lösenord vid nästa inloggning, alla förarens inloggningar avslutas direkt
    async function requirePasswordChange(id) {
      if (!confirm('Nollställ lösenordet för ' + id + '?\n\nFöraren loggas ut direkt och måste välja ett nytt lösenord nästa gång hen loggar in med sitt nuvarande lösenord.')) return;
      try {
        const r = await rpc('admin_require_password_change', { p_id: id });
        if (r && r.ok === false) { alert(errorTexts[r.error] || 'Det gick inte.'); return; }
        await reloadDrivers();
        render();
      } catch (e) {
        alert(errText(e));
      }
    }

    async function deactivateDriver(id) {
      if (!confirm('Avaktivera ' + id + '?\n\nLösenordet och alla inloggningar tas bort. All annan data sparas. För att aktivera igen behövs en ny aktiveringslänk och ett nytt lösenord.')) return;
      try {
        await rpc('admin_deactivate', { p_id: id });
        delete lastLinks[id];
        await reloadDrivers();
        render();
      } catch (e) {
        alert(errText(e));
      }
    }

    // ---- Bilar ----
    // bilnummer = taxinumret i resdatan (t.ex. A446) så att bilen kan kopplas till körpassen.
    // Antalet bilar här styr åkeriets mål (mål per bil × antal bilar).
    // Kostnad per mil räknas ut på servern vid varje visning: förbrukning × dagens pris (eller bilens/åkeriets manuella pris).
    const CAR_CATS = ['Kombi', 'Sedan', 'Miljö', 'Storbil'];
    const FUELS = { bensin: ['Bensin', 'l'], diesel: ['Diesel', 'l'], hvo100: ['HVO100', 'l'], e85: ['E85', 'l'], el: ['El', 'kWh'],
      laddhybrid: ['Laddhybrid', 'l'], vatgas: ['Vätgas', 'kg'], fordonsgas: ['Fordonsgas', 'kg'] };
    const PRICE_KEYS = { bensin: 'Bensin 95', diesel: 'Diesel', hvo100: 'HVO100', e85: 'E85', el_hem: 'El hemma/depå',
      el_snabb: 'El snabbladdning', vatgas: 'Vätgas', fordonsgas: 'Fordonsgas (biogas)' };
    let carMakes = null;          // märken från modelldatabasen
    const carVariants = {};       // märke -> varianter
    let carForm = null;           // formulärets aktuella värden

    async function loadCars() {
      carList = null;
      render();
      try { carList = await rpc('list_cars'); }
      catch (e) { carList = { can_edit: false, cars: [], error: true }; }
      render();
    }

    function num(n, d = 2) { return n == null || n === '' || isNaN(n) ? '' : Number(n).toFixed(d).replace('.', ','); }
    function numTrim(n) { return n == null || n === '' ? '' : String(Number(Number(n).toFixed(3))).replace('.', ','); }
    function parseNum(v) { v = String(v == null ? '' : v).trim().replace(/\s/g, '').replace(',', '.'); return v === '' ? null : Number(v); }
    function sd(x) { return x ? String(x).slice(0, 10) : ''; }
    function fuelPrices() { return (carList && carList.fuel && carList.fuel.prices) || {}; }
    function fuelCfg() { return (carList && carList.fuel && carList.fuel.config) || { el_surcharge: 0, el_home_share: 100 }; }

    function priceText(p) {
      if (!p || p.price == null) return 'inget pris';
      const kind = p.kind === 'company' ? 'åkeriets pris' : p.kind === 'manual' ? 'manuellt' : (p.source || '');
      return num(p.price) + ' kr/' + p.unit + ' (' + kind + (p.date ? ', ' + sd(p.date) : '') + ')';
    }

    function carCostLine(c) {
      const k = c.calc || {};
      if (k.mode === 'manual') return c.cost_per_mil_kr != null ? 'Bränsle ' + num(c.cost_per_mil_kr) + ' kr/mil (eget värde)' : '';
      const f = FUELS[c.fuel] || ['', ''];
      let s = f[0] + ': ';
      if (c.fuel === 'laddhybrid') {
        s += (c.cons != null ? numTrim(c.cons) + ' l/mil' : '') + (c.cons_el != null ? ' + ' + numTrim(c.cons_el) + ' kWh/mil' : '') + ', ' + (c.el_share || 0) + ' % el';
      } else s += numTrim(c.cons) + ' ' + f[1] + '/mil';
      const modeTxt = c.price_mode === 'manual' ? 'Manuellt pris' + (c.manual_price_set_at ? ' satt ' + sd(c.manual_price_set_at) : '') : 'Automatiskt pris';
      const pr = k.price && k.price.price != null ? num(k.price.price) + ' kr/' + k.price.unit : '';
      const pe = k.el_price && k.el_price.price != null ? num(k.el_price.price) + ' kr/kWh' : '';
      return s + ' · ' + modeTxt + (pr || pe ? ' ' + [pr, pe].filter(Boolean).join(' + ') : '') +
        ' · <b>' + (k.kr_per_mil != null ? '≈ ' + num(k.kr_per_mil) + ' kr/mil' : 'pris saknas') + '</b>';
    }

    function renderFuelBox() {
      const P = fuelPrices();
      const rows = Object.keys(PRICE_KEYS).map(k => {
        const p = P[k] || {};
        const val = p.price != null ? num(p.price) + ' kr/' + p.unit : (k === 'vatgas' ? 'inget pris – ange eget' : 'saknas');
        const src = p.kind === 'company' ? '<span class="fuel-own">Eget pris</span> satt ' + sd(p.company && p.company.set_at)
          : p.price != null ? esc(p.source || '') + (p.date ? ' · ' + sd(p.date) : '') : '';
        return `<div style="display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-bottom:1px solid #edf2f7;">
          <span>${PRICE_KEYS[k]}</span><span style="text-align:right;"><b>${val}</b><br><span style="font-size:11px; color:#718096;">${src}</span></span></div>`;
      }).join('');
      return `<details id="fuel-box" class="section" style="padding:10px 16px; font-size:13px;">
        <summary style="cursor:pointer; font-weight:600; color:#1a365d;">⛽ Drivmedelspriser idag</summary>
        <div style="margin-top:6px;">${rows}</div>
        <p style="font-size:11px; color:#718096; margin:6px 0;">Ungefärligt, företagslistpris inkl. moms. El hemma = elpris SE3 (elprisetjustnu.se) × 1,25 + påslag ${num(fuelCfg().el_surcharge)} kr/kWh. Hämtas varje dag efter kl. 14. Källor: OKQ8, Circle K (reserv), elprisetjustnu.se. Bilmodeller: Källa: EEA.</p>
        ${carList.can_edit ? '<button id="fuel-edit" onclick="editCar(\'fuel\')" style="width:100%;">Ändra åkeriets priser</button>' : ''}
      </details>`;
    }

    function renderCars(content) {
      if (carList === null) { content.innerHTML = '<div class="section"><p style="padding:16px;">Laddar...</p></div>'; return; }
      if (carList.error) { content.innerHTML = '<div class="section"><p style="padding:16px;">Kunde inte hämta bilarna.</p></div>'; return; }
      const cars = carList.cars || [];
      let html = `<div style="display:flex; align-items:center; justify-content:space-between; padding:4px 16px 0;">
        <span style="font-size:13px; color:#4a5568;">${cars.length} ${cars.length === 1 ? 'bil' : 'bilar'} – styr åkeriets mål</span>
        ${carList.can_edit ? '<button id="car-add" onclick="editCar(\'new\')" style="font-size:22px; padding:2px 14px;" aria-label="Lägg till bil">+</button>' : ''}
      </div>` + renderFuelBox() + '<div class="section">';
      if (!cars.length) html += `<p style="padding:16px;">Inga bilar inlagda ännu.${carList.can_edit ? ' Tryck på + för att lägga till en bil.' : ''}</p>`;
      cars.forEach(c => {
        const cost = carCostLine(c);
        html += `<div class="row car-row" ${carList.can_edit ? `onclick="editCar(${c.id})"` : ''} style="flex-direction:column; align-items:flex-start; gap:2px;${carList.can_edit ? '' : ' cursor:default;'}">
          <span class="label">${esc(c.bilnummer)} · ${esc(c.modell)}${c.regnr ? ' <span style="font-weight:400; color:#718096;">(' + esc(c.regnr) + ')</span>' : ''}</span>
          <span style="font-size:12px; color:#718096;">${esc((c.kategorier || []).join(', '))}</span>
          ${cost ? `<span class="car-cost" style="font-size:12px; color:#2d3748;">${cost}</span>` : ''}
        </div>`;
      });
      html += '</div>';
      if (!carList.can_edit) html += '<p style="padding:0 16px; font-size:12px; color:#718096;">Du kan se bilarna men inte ändra dem.</p>';
      content.innerHTML = html;
    }

    function editCar(id) {
      if (!carList || !carList.can_edit) return;
      editingCar = id;
      carForm = null;
      render();
    }

    // --- Åkeriets priser ---
    function renderFuelSettings(content) {
      const P = fuelPrices(), cfg = fuelCfg();
      content.innerHTML = `<div class="section" style="padding:16px;">
        <p style="font-size:13px; color:#4a5568; margin-top:0;">Lämna tomt = <b>automatiskt pris</b> (hämtas varje dag). Fyll i ett eget pris för att använda det för alla bilar med "Automatiskt pris". En bil med "Manuellt pris" använder alltid sitt eget pris.</p>
        ${Object.keys(PRICE_KEYS).map(k => {
          const p = P[k] || {}, a = p.auto || {};
          const unit = p.unit || (k.startsWith('el') ? 'kWh' : (k === 'vatgas' || k === 'fordonsgas') ? 'kg' : 'l');
          const autoTxt = k === 'el_hem' ? (a.spot != null ? 'Auto: spot ' + num(a.spot, 3) + ' × 1,25 + påslag (' + sd(a.date) + ')' : 'Auto: saknas')
            : a.price != null ? 'Auto: ' + num(a.price) + ' kr/' + unit + ' (' + esc(a.source || '') + ', ' + sd(a.date) + ')' : 'Auto: inget hämtat pris';
          return `<div class="form-group"><label>${PRICE_KEYS[k]} – eget pris (kr/${unit})</label>
            <input class="fp-in" data-k="${k}" type="text" inputmode="decimal" value="${p.company ? num(p.company.price) : ''}" placeholder="Automatiskt">
            <span style="font-size:11px; color:#718096;">${autoTxt}${p.company ? ' · eget pris satt ' + sd(p.company.set_at) : ''}</span></div>`;
        }).join('')}
        <div class="form-row">
          <div class="form-group"><label>El: påslag (kr/kWh)</label><input id="fp-sur" type="text" inputmode="decimal" value="${num(cfg.el_surcharge)}"><span style="font-size:11px; color:#718096;">Nätavgift, energiskatt, elhandel</span></div>
          <div class="form-group"><label>Laddning hemma/depå (%)</label><input id="fp-home" type="text" inputmode="numeric" value="${cfg.el_home_share}"><span style="font-size:11px; color:#718096;">Resten = snabbladdning</span></div>
        </div>
        <div class="modal-buttons">
          <button onclick="editingCar = null; render();">Avbryt</button>
          <button id="fp-save" onclick="saveFuelSettings()" style="background:#1a365d; color:white;">Spara</button>
        </div></div>`;
    }

    async function saveFuelSettings() {
      const prices = {};
      for (const el of document.querySelectorAll('.fp-in')) {
        const v = parseNum(el.value);
        if (v != null && !(v > 0 && v < 1000)) { alert('Priset för ' + PRICE_KEYS[el.dataset.k] + ' ska vara ett tal, t.ex. 95,50.'); return; }
        prices[el.dataset.k] = v;
      }
      const sur = parseNum(document.getElementById('fp-sur').value) ?? 0;
      const home = parseNum(document.getElementById('fp-home').value);
      if (!(sur >= 0 && sur < 20)) { alert('Påslaget ska vara 0–20 kr/kWh.'); return; }
      if (!(home >= 0 && home <= 100 && Number.isInteger(home))) { alert('Laddning hemma ska vara 0–100 %.'); return; }
      try {
        await rpc('save_fuel_settings', { p_prices: prices, p_el_surcharge: sur, p_el_home_share: home });
        editingCar = null;
        await loadCars();
      } catch (e) { alert(errText(e)); }
    }

    // --- Ny/ändra bil ---
    function consOf(v, fuel) {
      if (!v) return null;
      if (fuel === 'el') return v.kwh;
      if (fuel === 'vatgas' || fuel === 'fordonsgas') return v.kg;
      return v.l;
    }

    function renderEditCar(content) {
      if (editingCar === 'fuel') { renderFuelSettings(content); return; }
      const c = editingCar === 'new' ? { kategorier: [], cost_mode: 'calc', price_mode: 'auto' } : (carList.cars || []).find(x => x.id === editingCar);
      if (!c) { editingCar = null; render(); return; }
      if (!carForm) carForm = { make: c.make || '', model: '', model_id: c.model_id || null, own: !c.model_id && !!c.make };
      const isNew = editingCar === 'new';
      content.innerHTML = `<div class="section" style="padding:16px;">
        <div class="form-row">
          <div class="form-group"><label>Bilnummer (taxinr)</label><input id="c-nr" value="${esc(c.bilnummer || '')}" placeholder="t.ex. A446" autocapitalize="characters"></div>
          <div class="form-group"><label>Reg.nr (valfritt)</label><input id="c-reg" value="${esc(c.regnr || '')}" placeholder="t.ex. ABC123" autocapitalize="characters"></div>
        </div>
        <div class="form-group"><label>Märke</label><select id="c-make" onchange="carMakeChanged()"><option value="">Laddar...</option></select>
          <input id="c-make-own" value="${esc(carForm.own ? c.make || '' : '')}" placeholder="Märke" maxlength="40" style="margin-top:6px; ${carForm.own ? '' : 'display:none;'}"></div>
        <div class="form-group" id="c-model-g"><label>Modell</label><select id="c-model" onchange="carModelChanged()"></select></div>
        <div class="form-group" id="c-var-g"><label>Variant / bränsle</label><select id="c-var" onchange="carVariantChanged()"></select>
          <span id="c-var-note" style="font-size:11px; color:#718096;"></span></div>
        <div class="form-group"><label>Bilmodell (visas i listan)</label><input id="c-modell" value="${esc(c.modell || '')}" placeholder="t.ex. Toyota Corolla" maxlength="60"></div>
        <div class="form-group"><label>Kategori (minst en)</label>
          <div style="display:flex; flex-wrap:wrap; gap:8px 16px;">
            ${CAR_CATS.map(k => `<label style="display:flex; align-items:center; gap:6px; font-size:14px; color:#1a365d;"><input type="checkbox" class="c-cat" value="${k}" ${(c.kategorier || []).includes(k) ? 'checked' : ''} style="width:20px; height:20px;">${k}</label>`).join('')}
          </div>
        </div>
        <div class="form-group"><label>Bränslekostnad</label>
          <label class="radio-l"><input type="radio" name="c-cm" value="calc" ${c.cost_mode !== 'manual' ? 'checked' : ''} onchange="carCalcUpdate()"> Räkna ut (förbrukning × pris)</label>
          <label class="radio-l"><input type="radio" name="c-cm" value="manual" ${c.cost_mode === 'manual' ? 'checked' : ''} onchange="carCalcUpdate()"> Ange kr/mil själv</label>
        </div>
        <div id="c-manual-g" class="form-group"><label>Bränslekostnad (kr/mil)</label><input id="c-cost" type="text" inputmode="decimal" value="${c.cost_per_mil_kr != null ? num(c.cost_per_mil_kr) : ''}" placeholder="t.ex. 12,50"></div>
        <div id="c-calc-g">
          <div class="form-group"><label>Drivmedel</label><select id="c-fuel" onchange="carCalcUpdate(true)">
            <option value="">Välj...</option>${Object.keys(FUELS).map(k => `<option value="${k}" ${c.fuel === k ? 'selected' : ''}>${FUELS[k][0]}</option>`).join('')}</select></div>
          <div class="form-group" id="c-pf-g"><label>Laddhybridens bränsle</label><select id="c-pf" onchange="carCalcUpdate()">
            <option value="bensin" ${c.phev_fuel !== 'diesel' ? 'selected' : ''}>Bensin</option><option value="diesel" ${c.phev_fuel === 'diesel' ? 'selected' : ''}>Diesel</option></select></div>
          <div class="form-row">
            <div class="form-group"><label id="c-cons-l">Förbrukning</label><input id="c-cons" type="text" inputmode="decimal" value="${numTrim(c.cons)}" oninput="carCalcUpdate()"></div>
            <div class="form-group" id="c-ce-g"><label>El (kWh/mil)</label><input id="c-ce" type="text" inputmode="decimal" value="${numTrim(c.cons_el)}" oninput="carCalcUpdate()"></div>
          </div>
          <div class="form-row">
            <div class="form-group" id="c-es-g"><label>Körning på el (%)</label><input id="c-es" type="text" inputmode="numeric" value="${c.el_share ?? ''}" placeholder="0" oninput="carCalcUpdate()"></div>
            <div class="form-group" id="c-hs-g"><label>Laddning hemma/depå (%)</label><input id="c-hs" type="text" inputmode="numeric" value="${c.el_home_share ?? ''}" placeholder="${fuelCfg().el_home_share} (åkeriets)" oninput="carCalcUpdate()"></div>
          </div>
          <div class="form-group"><label>Pris</label>
            <label class="radio-l"><input type="radio" name="c-pm" value="auto" ${c.price_mode !== 'manual' ? 'checked' : ''} onchange="carCalcUpdate()"> Automatiskt pris</label>
            <label class="radio-l"><input type="radio" name="c-pm" value="manual" ${c.price_mode === 'manual' ? 'checked' : ''} onchange="carCalcUpdate()"> Manuellt pris</label>
            <div id="c-auto-info" style="font-size:12px; color:#4a5568;"></div>
          </div>
          <div class="form-row" id="c-mp-g">
            <div class="form-group"><label id="c-mp-l">Eget pris</label><input id="c-mp" type="text" inputmode="decimal" value="${c.manual_price != null ? num(c.manual_price) : ''}" oninput="carCalcUpdate()"></div>
            <div class="form-group" id="c-mep-g"><label>Eget elpris (kr/kWh)</label><input id="c-mep" type="text" inputmode="decimal" value="${c.manual_el_price != null ? num(c.manual_el_price) : ''}" oninput="carCalcUpdate()"></div>
          </div>
          <div id="c-mp-date" style="font-size:11px; color:#718096; margin:-6px 0 8px;">${c.price_mode === 'manual' && c.manual_price_set_at ? 'Manuellt pris satt ' + sd(c.manual_price_set_at) : ''}</div>
          <div id="c-result" style="font-size:15px; font-weight:600; color:#1a365d; margin-bottom:8px;"></div>
        </div>
        <div class="modal-buttons">
          <button onclick="editingCar = null; render();">Avbryt</button>
          <button id="c-save" onclick="saveCar()" style="background:#1a365d; color:white;">Spara</button>
        </div>
        ${!isNew ? `<button id="c-delete" onclick="deleteCar()" style="width:100%; margin-top:16px; color:#c53030; border-color:#c53030;">Ta bort bil</button>` : ''}
      </div>`;
      carCalcUpdate();
      fillCarMakes();
    }

    async function fillCarMakes() {
      const sel = document.getElementById('c-make');
      try { if (!carMakes) carMakes = await rpc('car_model_makes'); } catch (e) { carMakes = []; }
      if (!document.getElementById('c-make')) return;
      sel.innerHTML = '<option value="">Välj märke...</option>' + carMakes.map(m => `<option ${m === carForm.make && !carForm.own ? 'selected' : ''}>${esc(m)}</option>`).join('') +
        `<option value="__own" ${carForm.own ? 'selected' : ''}>Annan / skriv själv</option>`;
      if (carForm.make && !carForm.own && !carMakes.includes(carForm.make)) { carForm.own = true; sel.value = '__own'; document.getElementById('c-make-own').value = carForm.make; }
      await fillCarModels();
    }

    async function carMakeChanged() {
      const v = document.getElementById('c-make').value;
      carForm.own = v === '__own'; carForm.make = carForm.own ? '' : v; carForm.model_id = null; carForm.model = '';
      document.getElementById('c-make-own').style.display = carForm.own ? '' : 'none';
      await fillCarModels();
    }

    async function fillCarModels() {
      const mg = document.getElementById('c-model-g'), vg = document.getElementById('c-var-g');
      if (carForm.own || !carForm.make) { mg.style.display = 'none'; vg.style.display = 'none'; return; }
      mg.style.display = ''; vg.style.display = '';
      const sel = document.getElementById('c-model');
      sel.innerHTML = '<option>Laddar...</option>';
      try { if (!carVariants[carForm.make]) carVariants[carForm.make] = await rpc('car_model_variants', { p_make: carForm.make }); }
      catch (e) { carVariants[carForm.make] = []; }
      const vs = carVariants[carForm.make];
      if (carForm.model_id && !carForm.model) { const v = vs.find(x => x.id === carForm.model_id); if (v) carForm.model = v.model; }
      const models = [...new Set(vs.map(v => v.model))];
      sel.innerHTML = '<option value="">Välj modell...</option>' + models.map(m => `<option ${m === carForm.model ? 'selected' : ''}>${esc(m)}</option>`).join('') + '<option value="__own">Annan / skriv själv</option>';
      fillCarVariants();
    }

    function carModelChanged() {
      const v = document.getElementById('c-model').value;
      carForm.model = v === '__own' ? '' : v; carForm.model_id = null;
      if (v === '__own') { document.getElementById('c-var-g').style.display = 'none'; return; }
      document.getElementById('c-var-g').style.display = '';
      fillCarVariants();
      const mi = document.getElementById('c-modell');
      if (v && (!mi.value || mi.dataset.auto === '1')) { mi.value = carForm.make + ' ' + v; mi.dataset.auto = '1'; }
    }

    function variantLabel(v) {
      const f = FUELS[v.fuel][0] + (v.hybrid ? ' hybrid' : '') + (v.fuel === 'laddhybrid' && v.phev_fuel === 'diesel' ? ' (diesel)' : '');
      const cons = v.fuel === 'laddhybrid' ? [v.l != null ? numTrim(v.l) + ' l' : '', v.kwh != null ? numTrim(v.kwh) + ' kWh' : ''].filter(Boolean).join(' + ') + '/mil'
        : consOf(v, v.fuel) != null ? numTrim(consOf(v, v.fuel)) + ' ' + FUELS[v.fuel][1] + '/mil' : 'förbrukning saknas';
      return v.variant + ' · ' + f + (v.kw ? ' · ' + v.kw + ' kW' : '') + ' · ' + cons + ' · ' + v.years;
    }

    function fillCarVariants() {
      const sel = document.getElementById('c-var');
      const vs = (carVariants[carForm.make] || []).filter(v => v.model === carForm.model);
      sel.innerHTML = '<option value="">' + (vs.length ? 'Välj variant...' : '–') + '</option>' + vs.map(v => `<option value="${v.id}" ${v.id === carForm.model_id ? 'selected' : ''}>${esc(variantLabel(v))}</option>`).join('') + '<option value="__own">Annan / skriv själv</option>';
      showVariantNote();
    }

    function showVariantNote() {
      const v = (carVariants[carForm.make] || []).find(x => x.id === carForm.model_id);
      document.getElementById('c-var-note').textContent = v ? 'Förbrukning enligt EEA (WLTP), ' + v.n + ' registrerade i Sverige ' + v.years + (v.note ? '. ' + v.note : '') + '. Källa: EEA.' : '';
    }

    function carVariantChanged() {
      const val = document.getElementById('c-var').value;
      carForm.model_id = val && val !== '__own' ? Number(val) : null;
      const v = (carVariants[carForm.make] || []).find(x => x.id === carForm.model_id);
      showVariantNote();
      if (!v) return;
      const fs = document.getElementById('c-fuel');
      const keepHvo = v.fuel === 'diesel' && fs.value === 'hvo100';
      if (!keepHvo) fs.value = v.fuel;
      if (v.fuel === 'laddhybrid') { document.getElementById('c-pf').value = v.phev_fuel || 'bensin'; document.getElementById('c-ce').value = numTrim(v.kwh); }
      document.getElementById('c-cons').value = numTrim(consOf(v, v.fuel === 'laddhybrid' ? 'bensin' : v.fuel));
      const mi = document.getElementById('c-modell');
      if (!mi.value || mi.dataset.auto === '1') { mi.value = (carForm.make + ' ' + v.model).slice(0, 60); mi.dataset.auto = '1'; }
      document.querySelector('input[name="c-cm"][value="calc"]').checked = true;
      carCalcUpdate();
    }

    function radioVal(n) { const r = document.querySelector('input[name="' + n + '"]:checked'); return r ? r.value : null; }

    function elPrice(home) {
      const P = fuelPrices(), h = P.el_hem && P.el_hem.price, s = P.el_snabb && P.el_snabb.price;
      const sh = home ?? fuelCfg().el_home_share;
      const p = sh === 100 ? h : sh === 0 ? s : (h != null && s != null ? h * sh / 100 + s * (100 - sh) / 100 : null);
      return { price: p, txt: sh + ' % hemma ' + (h != null ? num(h) : '–') + ' / ' + (100 - sh) + ' % snabb ' + (s != null ? num(s) : '–') + ' kr/kWh' };
    }

    function carCalcUpdate(fuelChanged) {
      const cm = radioVal('c-cm'), fuel = document.getElementById('c-fuel').value, pm = radioVal('c-pm');
      const show = (id, on) => { const e = document.getElementById(id); if (e) e.style.display = on ? '' : 'none'; };
      show('c-manual-g', cm === 'manual'); show('c-calc-g', cm !== 'manual');
      const phev = fuel === 'laddhybrid';
      show('c-pf-g', phev); show('c-ce-g', phev); show('c-es-g', phev); show('c-hs-g', phev || fuel === 'el');
      show('c-mp-g', pm === 'manual'); show('c-mep-g', phev);
      const unit = fuel ? (phev ? 'l' : FUELS[fuel][1]) : '';
      document.getElementById('c-cons-l').textContent = phev ? 'Bränsle (l/mil)' : 'Förbrukning' + (unit ? ' (' + unit + '/mil)' : '');
      document.getElementById('c-mp-l').textContent = 'Eget pris' + (unit ? ' (kr/' + unit + ')' : '');
      if (cm === 'manual' || !fuel) { document.getElementById('c-result').textContent = ''; document.getElementById('c-auto-info').textContent = ''; return; }
      const P = fuelPrices(), home = parseNum(document.getElementById('c-hs').value);
      const mainKey = phev ? document.getElementById('c-pf').value : fuel;
      const autoMain = fuel === 'el' ? elPrice(home) : { price: P[mainKey] && P[mainKey].price, txt: priceText(P[mainKey]) };
      const autoEl = phev ? elPrice(home) : null;
      document.getElementById('c-auto-info').textContent = pm === 'manual' ? '' : 'Används nu: ' + (fuel === 'el' ? autoMain.txt : autoMain.txt + (autoEl ? ' · el: ' + autoEl.txt : '')) +
        (fuel === 'vatgas' && autoMain.price == null ? ' – ange eget pris här eller under "Ändra åkeriets priser".' : '');
      const mp = parseNum(document.getElementById('c-mp').value), mep = parseNum(document.getElementById('c-mep').value);
      const pMain = pm === 'manual' && mp != null ? mp : autoMain.price;
      const pEl = phev ? (pm === 'manual' && mep != null ? mep : autoEl.price) : null;
      const cons = parseNum(document.getElementById('c-cons').value), ce = parseNum(document.getElementById('c-ce').value);
      let kr = null;
      if (phev) {
        const s = (parseNum(document.getElementById('c-es').value) || 0) / 100;
        const a = s < 1 ? (cons != null && pMain != null ? (1 - s) * cons * pMain : null) : 0;
        const b = s > 0 ? (ce != null && pEl != null ? s * ce * pEl : null) : 0;
        kr = a == null || b == null ? null : a + b;
      } else if (cons != null && pMain != null) kr = cons * pMain;
      document.getElementById('c-result').textContent = kr != null ? '≈ ' + num(Math.round(kr * 100 + 1e-6) / 100) + ' kr/mil (ungefärligt)' : 'Kostnad: fyll i förbrukning och pris';
    }

    async function saveCar() {
      const cats = [...document.querySelectorAll('.c-cat:checked')].map(x => x.value);
      const cm = radioVal('c-cm'), pm = radioVal('c-pm'), fuel = document.getElementById('c-fuel').value || null;
      const make = carForm.own ? document.getElementById('c-make-own').value.trim() : carForm.make;
      const car = {
        bilnummer: document.getElementById('c-nr').value.trim(),
        regnr: document.getElementById('c-reg').value.trim() || null,
        modell: document.getElementById('c-modell').value.trim(),
        kategorier: cats, make: make || null, model_id: carForm.own ? null : carForm.model_id,
        cost_mode: cm, price_mode: pm, fuel,
        cost_per_mil_kr: parseNum(document.getElementById('c-cost').value),
        cons: parseNum(document.getElementById('c-cons').value), cons_el: parseNum(document.getElementById('c-ce').value),
        phev_fuel: document.getElementById('c-pf').value, el_share: parseNum(document.getElementById('c-es').value),
        el_home_share: parseNum(document.getElementById('c-hs').value),
        manual_price: parseNum(document.getElementById('c-mp').value), manual_el_price: parseNum(document.getElementById('c-mep').value)
      };
      if (!car.bilnummer) { alert('Fyll i bilnummer.'); return; }
      if (!car.modell) { alert('Fyll i bilmodell.'); return; }
      if (!cats.length) { alert('Välj minst en kategori.'); return; }
      const bad = (v, lo, hi) => v != null && !(v > lo && v < hi);
      if (cm === 'manual') {
        if (car.cost_per_mil_kr == null || bad(car.cost_per_mil_kr, 0, 1000.01)) { alert('Bränslekostnaden ska vara ett tal mellan 0 och 1000 kr/mil, t.ex. 12,50.'); return; }
      } else {
        if (!fuel) { alert('Välj drivmedel.'); return; }
        if (fuel === 'laddhybrid' ? (car.cons == null && car.cons_el == null) : car.cons == null) { alert('Fyll i förbrukning.'); return; }
        if (bad(car.cons, 0, 100) || bad(car.cons_el, 0, 100)) { alert('Förbrukningen ska vara ett tal, t.ex. 0,65.'); return; }
        if ([car.el_share, car.el_home_share].some(v => v != null && !(Number.isInteger(v) && v >= 0 && v <= 100))) { alert('Procent ska vara 0–100.'); return; }
        if (pm === 'manual' && car.manual_price == null && car.manual_el_price == null) { alert('Fyll i ett eget pris eller välj Automatiskt pris.'); return; }
        if (bad(car.manual_price, 0, 1000) || bad(car.manual_el_price, 0, 1000)) { alert('Priset ska vara ett tal, t.ex. 2,50.'); return; }
      }
      try {
        await rpc('save_car', { p_id: editingCar === 'new' ? null : editingCar, p_car: car });
        editingCar = null; carForm = null;
        await loadCars();
      } catch (e) { alert(errText(e)); }
    }

    async function deleteCar() {
      const c = (carList.cars || []).find(x => x.id === editingCar);
      if (!c || !confirm('Ta bort bil ' + c.bilnummer + ' (' + c.modell + ')?')) return;
      try {
        await rpc('delete_car', { p_id: c.id });
        editingCar = null;
        await loadCars();
      } catch (e) { alert(errText(e)); }
    }

    // ---- Aktivitetslogg ----
    const logRoleLabels = { superadmin: 'S admin', agare: 'Ägare', admin: 'Admin', standard: 'Standard', semester: 'Semester', avslutad: 'Avslutad' };
    const resetResults = { sent: 'länk skickad', email_not_configured: 'e-post ej konfigurerad', send_failed: 'e-post kunde inte skickas', no_email: 'ingen e-postadress', inactive: 'kontot inaktivt', unknown_id: 'okänt förar-ID', rate_limited_id: 'för många försök', rate_limited_total: 'för många försök totalt' };
    const failReasons = { wrong_password: 'fel lösenord', inactive: 'kontot inaktivt', ended: 'kontot avslutat', pending: 'har inte aktiverat kontot än' };

    function esc(x) {
      return String(x == null ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function catName(c) { return (logRoleLabels[c] || c || '').toLowerCase(); }

    function describeLog(e) {
      const who = e.actor_role === 'system' ? 'Systemet' : (logRoleLabels[e.actor_role] || 'Förare') + ' ' + (e.actor_id || '?');
      const d = e.details || {};
      switch (e.action) {
        case 'login': return who + ' loggade in' + (e.via_master ? ' (med huvudlösenordet)' : '');
        case 'login_failed': return 'Misslyckad inloggning för ' + (e.target_id || '?') + (failReasons[d.reason] ? ' (' + failReasons[d.reason] + ')' : '');
        case 'activate': return who + ' aktiverade ' + e.target_id + (d.category ? ' som ' + catName(d.category) : '');
        case 'deactivate': return who + ' avaktiverade ' + e.target_id;
        case 'deactivate_cleanup': return 'Systemet städade avaktiverade ' + e.target_id + ' (gammalt lösenord och nollställning borttagna)';
        case 'auto_deactivate': return 'Systemet avaktiverade ' + e.target_id + ' (' + (d.days || 30) + ' dagar utan inloggning)';
        case 'activation_link': return who + ' skapade ny aktiveringslänk för ' + e.target_id;
        case 'activation_complete': return (e.target_id || '?') + ' aktiverade sitt konto och valde lösenord';
        case 'activation_failed': return 'Misslyckad kontoaktivering för ' + (e.target_id || '?') + ' (fel förar-ID)';
        case 'goals_change': return who + ' ändrade åkeriets mål' + (d.to ? ' (per bil: ' + d.to.month + ' kr/mån, ' + d.to.week + ' kr/v, ' + d.to.day + ' kr/dag' + (d.to.cars ? ', ' + d.to.cars + ' bilar' : '') + ')' : '');
        case 'car_add': return who + ' lade till bil ' + (e.target_id || '') + (d.modell ? ' (' + d.modell + ')' : '');
        case 'car_edit': return who + ' ändrade bil ' + (e.target_id || '');
        case 'fuel_settings': return who + ' ändrade åkeriets drivmedelspriser';
        case 'car_delete': return who + ' tog bort bil ' + (e.target_id || '') + (d.modell ? ' (' + d.modell + ')' : '');
        case 'profile_update': return who + ' uppdaterade sina personuppgifter' + (e.via_master ? ' (med huvudlösenordet)' : '');
        case 'password_change': return who + ' bytte lösenord' + (e.via_master ? ' (med huvudlösenordet)' : '');
        case 'password_change_failed': return 'Misslyckat lösenordsbyte för ' + (e.target_id || '?') + ' (fel nuvarande lösenord)';
        case 'require_password_change': return who + ' nollställde lösenordet för ' + (e.target_id || '?');
        case 'password_reset_request': return 'Glömt lösenord för ' + (e.target_id || '?') + ': ' + (resetResults[String(d.result || '').split(':')[0]] || d.result || '?');
        case 'password_reset': return who + ' valde nytt lösenord via e-postlänken' + (d.sessions_ended ? ' (' + d.sessions_ended + ' inloggningar avslutades)' : '');
        case 'password_forced_change': return who + ' valde nytt lösenord efter nollställning';
        case 'workshop_add': return who + ' registrerade verkstadstid ' + wsSpan(d);
        case 'workshop_edit': return who + ' ändrade sin verkstadstid till ' + wsSpan(d);
        case 'workshop_delete': return who + ' tog bort sin verkstadstid ' + wsSpan(d);
        case 'workshop_approve': return who + ' godkände verkstadstid för ' + (e.target_id || '?') + ' ' + wsSpan(d) + (d.kr != null ? ' = ' + formatSEK(d.kr) : '') + (d.from === 'rejected' ? ' (var nekad)' : '') + (d.comment ? ' – "' + d.comment + '"' : '');
        case 'workshop_reject': return who + ' nekade verkstadstid för ' + (e.target_id || '?') + ' ' + wsSpan(d) + (d.from === 'approved' ? ' (var godkänd)' : '') + (d.comment ? ' – "' + d.comment + '"' : '');
        case 'workshop_rate': return who + ' ändrade timpriset för verkstadstid från ' + d.from + ' till ' + d.to + ' kr/h';
        case 'bil_issue_add': return who + (d.kind === 'supply' ? ' skrev att något behövs' : ' anmälde fel') + (d.car ? ' på bil ' + d.car : '') + (d.blocking ? ' (bilen står)' : '');
        case 'bil_issue_edit': return who + ' ändrade en ' + (d.kind === 'supply' ? 'behovsanmälan' : 'felanmälan') + (d.car ? ' på bil ' + d.car : '');
        case 'bil_issue_status': return who + ' ändrade status ' + (bilSt[d.from] || d.from) + ' → ' + (bilSt[d.to] || d.to) + (d.car ? ' (bil ' + d.car + ')' : '') + (d.comment ? ' – "' + d.comment + '"' : '');
        case 'bil_issue_delete': return who + ' tog bort en ' + (d.kind === 'supply' ? 'behovsanmälan' : 'felanmälan') + (d.car ? ' på bil ' + d.car : '');
        case 'bil_maint_add': return who + (d.status === 'forslag' ? ' föreslog underhåll' : ' planerade underhåll') + ' (' + (d.type || '') + ')' + (d.car ? ' på bil ' + d.car : '');
        case 'bil_maint_edit': return who + ' ändrade underhåll (' + (d.type || '') + ')' + (d.car ? ' på bil ' + d.car : '');
        case 'bil_maint_done': return who + ' markerade underhåll klart (' + (d.type || '') + ')' + (d.km != null ? ' vid ' + d.km + ' km' : '') + (d.cost != null ? ' = ' + formatSEK(d.cost) : '');
        case 'bil_maint_delete': return who + ' tog bort underhåll (' + (d.type || '') + ')';
        case 'bil_km': return who + ' angav mätarställning ' + d.to + ' km för bil ' + (d.car || '?');
        case 'bil_task_add': return who + ' skickade uppgiften "' + (d.title || '') + '" till ' + (e.target_id || '?') + (d.car ? ' (bil ' + d.car + ')' : '');
        case 'bil_task_edit': return who + ' ändrade uppgiften "' + (d.title || '') + '" (' + (e.target_id || '?') + ')';
        case 'bil_task_delete': return who + ' tog bort uppgiften "' + (d.title || '') + '" (' + (e.target_id || '?') + ')';
        case 'bil_task_reply': return who + ' svarade på uppgiften "' + (d.title || '') + '"' + (d.booked_at ? ' – bokad ' + new Date(d.booked_at).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' }) : '') + (d.place ? ', ' + d.place : '');
        case 'bil_task_done': return who + ' markerade uppgiften "' + (d.title || '') + '" klar' + (d.car ? ' (bil ' + d.car + ')' : '') + (d.comment ? ' – "' + d.comment + '"' : '');
        case 'bil_prefs': return who + ' ändrade sina notisval för Bil & verkstad';
        case 'category_change': return who + ' ändrade kategori på ' + e.target_id + ' till ' + catName(d.to);
        default: return who + ': ' + e.action + ' ' + (e.target_id || '');
      }
    }

    const bilSt = { ny: 'Ny', pagar: 'Pågår', klar: 'Klar' };
    // Verkstadstid i loggen: "tor 22/10 08:00–11:30 (3 h 30 min, TEST-VK1)"
    function wsSpan(d) {
      if (!d || !d.start) return '';
      const p = n => String(n).padStart(2, '0');
      const a = new Date(d.start), b = new Date(d.end);
      const dl = x => days[x.getDay()] + ' ' + x.getDate() + '/' + (x.getMonth() + 1);
      const hm = x => p(x.getHours()) + ':' + p(x.getMinutes());
      const m = Math.round(d.minutes || 0);
      return dl(a) + ' ' + hm(a) + '–' + (a.toDateString() === b.toDateString() ? '' : dl(b) + ' ') + hm(b) +
        ' (' + Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '') + (d.car ? ', ' + d.car : '') + ')';
    }

    function formatLogTime(t) {
      return new Date(t).toLocaleString('sv-SE', { timeZone: 'Europe/Stockholm', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    async function openLog() {
      showLog = true;
      logEntries = null;
      render();
      try {
        logEntries = await rpc('admin_get_log', { p_limit: 300 });
      } catch (e) {
        logEntries = [];
        alert(errText(e));
      }
      render();
    }

    function renderLog(content) {
      if (logEntries === null) { content.innerHTML = '<div class="section"><p style="padding:16px;">Laddar...</p></div>'; return; }
      let html = '<div class="section">';
      if (!logEntries.length) html += '<p style="padding:16px;">Ingen aktivitet ännu.</p>';
      logEntries.forEach(e => {
        html += `<div class="row" style="flex-direction:column; align-items:flex-start; gap:2px;">
          <span style="font-size:12px; color:#718096;">${esc(formatLogTime(e.time))}</span>
          <span class="label">${esc(describeLog(e))}</span>
        </div>`;
      });
      html += '</div>';
      content.innerHTML = html;
    }

    function openMenu(id) {
      if (id === 'akeridata') { location.href = 'akeridata.html'; return; }
      const item = menu.find(m => m.id === id);
      path = [{ id, label: item.label }];
      editingDriver = null;
      editingCar = null;
      if (id === 'bilar') loadCars();
      showLog = false;
      selectedDay = null;
      selectedCar = null;
      if (id === 'verkstad') { VERKSTAD_ADMIN.load(); return; }
      render();
    }

    function goBack() {
      if (selectedCar) {
        selectedCar = null;
      } else if (selectedDay) {
        selectedDay = null;
      } else if (showLog) {
        showLog = false;
      } else if (editingCar) {
        editingCar = null;
      } else if (editingDriver) {
        editingDriver = null;
      } else {
        path.pop();
      }
      render();
    }

    function toggleProfile() {
      const menu = document.getElementById('profile-menu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
    async function logout() {
      try { await rpc('logout'); } catch (e) {}
      ['taxi_session', 'taxi_logged_in', 'taxi_driver', 'taxi_view'].forEach(k => localStorage.removeItem(k));
      location.href = 'index.html';
    }
    function goHome() {
      location.href = 'index.html';
    }

    function goTo(index) {
      path = path.slice(0, index + 1);
      editingDriver = null;
      editingCar = null;
      showLog = false;
      selectedDay = null;
      selectedCar = null;
      render();
    }

    loadData();
  </script>
