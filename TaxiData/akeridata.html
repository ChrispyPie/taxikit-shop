<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Åkeridata – TaxiData</title>
  <script src="tema.js?v=20261026tm1"></script>
  <link rel="stylesheet" href="style.css?v=20261026zzsl1">
  <link rel="stylesheet" href="tema.css?v=20261026tm1">
  <style>
    header { display: flex; align-items: center; justify-content: space-between; }
    header h1 { position: absolute; left: 50%; transform: translateX(-50%); }
    .hidden { display: none !important; }
    #denied { text-align: center; padding: 48px 16px; }
    #ak-pick-row { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; padding: 0.4rem 1rem 0; font-size: 0.85rem; }
    #ak-pick-row select { max-width: 70%; font-size: 0.85rem; padding: 0.3rem 0.4rem; border-radius: 6px; border: 1px solid var(--c-cbd5e0); background: var(--surface); color: inherit; }
    .ak-bd-title .label { font-weight: 600; }
    #denied button { margin-top: 16px; padding: 0.6rem 1.2rem; border-radius: 8px; border: 2px solid var(--primary); background: var(--surface); color: var(--primary); }
  </style>
</head>
<body>
  <!-- Åkeridata: samma uppbyggnad som Körpassdata, men för hela åkeriet (alla förare och bilar). -->
  <div id="denied" class="hidden">
    <h2>Ingen behörighet</h2>
    <p>Åkeridata är bara för ägaren.</p>
    <button onclick="location.href='index.html'">Tillbaka</button>
  </div>
  <div id="dashboard-view" class="hidden">
    <header>
      <button onclick="location.href='admin.html'" aria-label="Tillbaka till admin">←</button>
      <h1>Åkeridata</h1>
      <span id="driver-label"></span>
    </header>
    <div id="ak-pick-row" class="hidden"><label for="ak-pick" id="ak-pick-label">Bil</label><select id="ak-pick"></select></div>
    <div class="controls">
      <div class="tabs">
        <button class="tab active" data-tab="dag">Dag</button>
        <button class="tab" data-tab="vecka">Vecka</button>
        <button class="tab" data-tab="manad">Månad</button>
        <button class="tab" data-tab="ar">År</button>
      </div>
      <div class="date-nav">
        <button id="prev">‹</button>
        <div id="current-date">Idag</div>
        <button id="next">›</button>
        <button id="today">»</button>
        <button id="period-btn" title="Välj egen period" aria-label="Välj egen period">📅</button>
      </div>
      <div id="server-status" class="server-status" style="display:none"></div>
      <div id="last-updated" style="text-align:center; font-size:0.8rem; color:var(--c-718096); margin-top:0.3rem;"></div>
    </div>
    <main id="dashboard"><div class="section"><div class="stat-row">Laddar...</div></div></main>
  </div>

  <script>window.TAXI_MODE = 'company';</script>
  <script src="serverstatus.js?v=20261026tm1"></script>
  <script src="script.js?v=20261028sp1"></script>
  <script src="demo.js?v=zzzda1"></script>
  <script>
    // Åkeridata är för ägaren. TILLFÄLLIGT får även S admin se åkeriets nivå (utan förar-id)
    // under utvecklingen – samma lista som private.company_view_roles() på servern.
    // Servern kontrollerar behörigheten: admin får bara sin egen data och inga mål.
    const AKERI_ROLES = ['agare', 'superadmin'];
    (async function () {
      if (!localStorage.getItem('taxi_session')) { location.href = 'index.html'; return; }
      let me = null;
      try { me = await tripRpc('get_me'); } catch (e) { location.href = 'index.html'; return; }
      if (me && me.must_change_password) { location.href = 'index.html'; return; }
      // Ägar-demo: servern lämnar aldrig ut åkeriets siffror till en demosession. Visa en förklaring i stället.
      if (me && me.demo && window.DEMO) {
        DEMO.set(me); DEMO.banner();
        const d = document.getElementById('denied');
        d.innerHTML = '<div class="section" style="padding:16px; line-height:1.45;"><b>Åkeridata i demon</b><br>Här ser ägaren hela åkeriets intäkter, ' +
          'körpass och mål per dag, vecka, månad och år, uppdelat per förare och bil. I demon visas inga av åkeriets riktiga siffror.' +
          '<br><br><a href="admin.html" style="color:var(--c-3182ce);">Tillbaka till admin</a></div>';
        d.classList.remove('hidden');
        return;
      }
      if (!me || !AKERI_ROLES.includes(me.category)) {
        document.getElementById('denied').classList.remove('hidden');
        return;
      }
      myRole = me.category;
      document.getElementById('dashboard-view').classList.remove('hidden');
      syncTabs();
      if (window.initServerStatus) initServerStatus('server-status');
      akSetupPicker();   // väljaren Åkeri / Bil / Chaufför uppe till höger
      await loadData();
      render();
    })();
  </script>
</body>
</html>
