<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <radialGradient id="parch23" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#f5ead4"/>
      <stop offset="70%" stop-color="#e3cea4"/>
      <stop offset="100%" stop-color="#bfa272"/>
    </radialGradient>
    <linearGradient id="cabin23" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c281e"/>
      <stop offset="100%" stop-color="#22150f"/>
    </linearGradient>
    <radialGradient id="lamp23" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4bf" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#eab354" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#eab354" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" rx="14" fill="url(#parch23)"/>
  <rect x="14" y="14" width="612" height="372" rx="10" fill="none" stroke="#6c4d2e" stroke-width="1.5" opacity="0.6"/>
  <!-- Tall carriage-built taxi cabin cutaway -->
  <path d="M120,350 L120,88 Q120,44 185,42 L455,42 Q520,44 520,88 L520,350 Z" fill="url(#cabin23)" stroke="#5b3d26" stroke-width="4"/>
  <!-- Interior ceiling & trim -->
  <path d="M138,348 L138,94 Q138,60 192,58 L448,58 Q502,60 502,94 L502,348 Z" fill="#4e3425" stroke="#b98b48" stroke-width="1.5"/>
  <!-- Window showing snowy evening street -->
  <rect x="172" y="114" width="165" height="122" rx="8" fill="#1e2d3f" stroke="#c89d54" stroke-width="3"/>
  <circle cx="215" cy="150" r="14" fill="#ffe9a3" opacity="0.3"/>
  <circle cx="215" cy="150" r="4" fill="#fff5cc"/>
  <line x1="215" y1="154" x2="215" y2="236" stroke="#111924" stroke-width="3"/>
  <path d="M174,218 Q240,204 335,216 L335,234 L174,234 Z" fill="#cbd8e6" opacity="0.7"/>
  <!-- Draped curtains -->
  <path d="M172,114 Q198,158 184,236 L172,236 Z" fill="#7a2424"/>
  <path d="M337,114 Q312,158 325,236 L337,236 Z" fill="#7a2424"/>
  <!-- Warm brass interior lamp -->
  <circle cx="465" cy="112" r="52" fill="url(#lamp23)"/>
  <path d="M456,96 L474,96 L470,114 L460,114 Z" fill="#f7db86" stroke="#8a6220" stroke-width="1.5"/>
  <!-- Tufted leather/velvet seat -->
  <path d="M220,256 L476,256 Q492,256 492,276 L492,342 L205,342 L205,280 Q205,256 220,256 Z" fill="#6b2522" stroke="#361412" stroke-width="2"/>
  <path d="M210,305 L488,305" stroke="#471614" stroke-width="2"/>
  <!-- Gentleman passenger seated wearing tall silk top hat with headroom! -->
  <g transform="translate(362,135)">
    <!-- Coat & shoulders -->
    <path d="M-32,170 Q-28,112 8,108 Q44,112 52,170 Z" fill="#1e1c21" stroke="#0f0e11" stroke-width="1.5"/>
    <!-- White scarf/collar -->
    <path d="M-4,110 L10,128 L24,110 Z" fill="#ece2ce"/>
    <!-- Head -->
    <ellipse cx="10" cy="84" rx="18" ry="21" fill="#e2bfa0" stroke="#7d583d" stroke-width="1"/>
    <!-- Mustache -->
    <path d="M-2,90 Q6,86 10,90 Q14,86 22,90" fill="none" stroke="#4a3525" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tall silk top hat -->
    <path d="M-12,68 L-8,12 L28,12 L32,68 Z" fill="#161519" stroke="#3a3842" stroke-width="1.2"/>
    <rect x="-24" y="65" width="68" height="7" rx="3" fill="#111014"/>
    <rect x="-9" y="56" width="38" height="8" fill="#5e2121"/>
    <path d="M-2,16 L2,64" stroke="rgba(255,255,255,0.22)" stroke-width="3"/>
  </g>
  <!-- Headroom clearance arrow note -->
  <line x1="436" y1="68" x2="436" y2="146" stroke="#f0d799" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="320" y="374" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#3b2314">Högt i tak för hög hatt – tidig svensk droskbil</text>
</svg>
