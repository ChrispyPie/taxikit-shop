<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <radialGradient id="parch12" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#f7eed8"/>
      <stop offset="68%" stop-color="#e8d6b0"/>
      <stop offset="100%" stop-color="#cbb182"/>
    </radialGradient>
    <linearGradient id="river12" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#9cb5bc"/>
      <stop offset="50%" stop-color="#b4cad0"/>
      <stop offset="100%" stop-color="#8da7af"/>
    </linearGradient>
    <filter id="soft12" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.24  0 0 0 0 0.12  0 0 0 0.08 0" in="n" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="400" rx="14" fill="url(#parch12)"/>
  <rect x="14" y="14" width="612" height="372" rx="10" fill="none" stroke="#7d5d38" stroke-width="1.5" opacity="0.65"/>
  <rect x="20" y="20" width="600" height="360" rx="8" fill="none" stroke="#7d5d38" stroke-width="0.7" stroke-dasharray="4 3" opacity="0.5"/>
  <!-- Göta älv & Vallgraven -->
  <path d="M-10,165 Q120,125 260,152 T490,128 Q575,112 650,95 L650,150 Q560,165 480,182 T250,206 Q115,180 -10,218 Z" fill="url(#river12)" stroke="#5b7279" stroke-width="1.4" opacity="0.85"/>
  <path d="M210,198 Q265,245 335,248 Q405,246 435,185" fill="none" stroke="#859fa8" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
  <!-- City street blocks -->
  <g stroke="#7a5e3e" stroke-width="1" opacity="0.32" fill="none">
    <path d="M180,215 L440,215 M210,235 L425,235 M240,255 L410,255 M270,195 L270,275 M320,190 L320,285 M370,195 L370,270"/>
    <path d="M110,95 L520,95 M130,305 L510,305 M140,80 L195,330 M490,75 L445,335"/>
  </g>
  <!-- 4 Taxizoner 1952 -->
  <circle cx="320" cy="210" r="158" fill="rgba(166,118,58,0.08)" stroke="#6d3a22" stroke-width="1.8" stroke-dasharray="8 5"/>
  <circle cx="320" cy="210" r="118" fill="rgba(166,118,58,0.08)" stroke="#6d3a22" stroke-width="1.8" stroke-dasharray="6 4"/>
  <circle cx="320" cy="210" r="78" fill="rgba(166,118,58,0.09)" stroke="#6d3a22" stroke-width="1.8"/>
  <circle cx="320" cy="210" r="38" fill="rgba(181,64,45,0.14)" stroke="#8b2e20" stroke-width="2"/>
  <!-- Zone numbers -->
  <g font-family="Georgia,serif" font-weight="bold" fill="#4f2918" text-anchor="middle">
    <text x="320" y="216" font-size="18">ZON I</text>
    <text x="320" y="152" font-size="15">ZON II</text>
    <text x="320" y="112" font-size="15">ZON III</text>
    <text x="320" y="72" font-size="15">ZON IV</text>
  </g>
  <!-- Centralen & Bridge markers -->
  <rect x="336" y="185" width="16" height="10" rx="2" fill="#8b2e20" stroke="#3d2214" stroke-width="1"/>
  <text x="357" y="194" font-family="Georgia,serif" font-size="11" fill="#3d2214">Centralen</text>
  <line x1="292" y1="152" x2="306" y2="205" stroke="#4f2918" stroke-width="3.5"/>
  <!-- Vintage cab silhouette -->
  <g transform="translate(292,232)" fill="#2e231c">
    <path d="M6,14 L12,4 L36,4 L44,14 L52,15 L52,22 L2,22 L2,15 Z"/>
    <rect x="20" y="0" width="10" height="4" rx="1" fill="#d4a017"/>
    <circle cx="13" cy="23" r="5" fill="#1a120d"/><circle cx="13" cy="23" r="2" fill="#d9c6a3"/>
    <circle cx="40" cy="23" r="5" fill="#1a120d"/><circle cx="40" cy="23" r="2" fill="#d9c6a3"/>
  </g>
  <!-- Compass rose -->
  <g transform="translate(555,78)" stroke="#4f2918" stroke-width="1.2" fill="none">
    <circle r="24" opacity="0.5"/>
    <polygon points="0,-22 5,-5 22,0 5,5 0,22 -5,5 -22,0 -5,-5" fill="#d9c29c"/>
    <polygon points="0,-22 5,-5 0,0" fill="#6d3a22"/>
    <text x="0" y="-27" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#4f2918" stroke="none">N</text>
  </g>
  <!-- Cartouche -->
  <rect x="36" y="324" width="215" height="40" rx="6" fill="#f5ead1" stroke="#6d4c2c" stroke-width="1.3"/>
  <text x="143" y="343" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="13" fill="#3d2414">GÖTEBORGS TAXIZONER</text>
  <text x="143" y="357" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="11" fill="#6a492c">Länsstyrelsen 1952 · Zon I–IV</text>
