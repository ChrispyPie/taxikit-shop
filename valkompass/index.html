<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valkompass – Testa din riktiga alignment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1.25rem 0.9rem; }
    .container { max-width: 520px; width: 100%; }
    h1 { font-size: 1.45rem; margin-bottom: 0.35rem; text-align: center; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 1.3rem; font-size: 0.88rem; }
    .card { background: #1e293b; border-radius: 12px; padding: 1.15rem; margin-bottom: 1rem; }
    button { background: #3b82f6; color: white; border: none; padding: 0.7rem 1rem; border-radius: 8px; font-size: 0.95rem; cursor: pointer; width: 100%; }
    button:hover { background: #2563eb; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #64748b; }
    .party-btn { background: #334155; margin-bottom: 0.35rem; text-align: left; display: flex; justify-content: space-between; align-items: center; }
    .party-btn:hover { background: #475569; }
    .party-btn .pct { font-size: 0.78rem; color: #94a3b8; }
    .hidden { display: none !important; }
    .progress { height: 5px; background: #334155; border-radius: 3px; margin-bottom: 1.1rem; overflow: hidden; }
    .progress-bar { height: 100%; background: #3b82f6; width: 0%; transition: width 0.3s; }
    .question { font-size: 1.05rem; margin-bottom: 1rem; line-height: 1.4; }
    .options button { background: #334155; text-align: left; margin-top: 0.4rem; }
    .options button:hover { background: #475569; }
    .result-item { display: flex; justify-content: space-between; align-items: center; padding: 0.65rem 0; border-bottom: 1px solid #334155; cursor: pointer; }
    .result-item:hover { background: #1e293b; }
    .match { font-weight: 600; color: #4ade80; }
    .low { color: #f87171; }
    .explanation { font-size: 0.85rem; color: #94a3b8; margin-top: 0.35rem; display: none; line-height: 1.4; }
    .explanation.open { display: block; }

    /* 2D Compass – soft gradients */
    .compass-wrapper { margin-bottom: 1.1rem; }
    .compass {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 0.78;
      border-radius: 12px;
      border: 1px solid #334155;
      overflow: hidden;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(220, 38, 38, 0.55) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 20%, rgba(37, 99, 235, 0.55) 0%, transparent 55%),
        radial-gradient(ellipse at 20% 80%, rgba(234, 88, 12, 0.5) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(30, 58, 138, 0.6) 0%, transparent 55%),
        linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #1e1b4b 100%);
    }
    .compass::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, transparent 49.2%, rgba(148,163,184,0.35) 49.2%, rgba(148,163,184,0.35) 50.8%, transparent 50.8%),
        linear-gradient(to bottom, transparent 49.2%, rgba(148,163,184,0.35) 49.2%, rgba(148,163,184,0.35) 50.8%, transparent 50.8%);
      pointer-events: none;
    }
    .compass-label { position: absolute; font-size: 0.68rem; color: #e2e8f0; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.8); z-index: 1; }
    .compass-label.left { left: 8px; top: 50%; transform: translateY(-50%); }
    .compass-label.right { right: 8px; top: 50%; transform: translateY(-50%); }
    .compass-label.top { top: 7px; left: 50%; transform: translateX(-50%); }
    .compass-label.bottom { bottom: 7px; left: 50%; transform: translateX(-50%); }

    .compass-marker {
      position: absolute;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 700;
      color: white;
      cursor: pointer;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      z-index: 3;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .compass-marker:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 10; }
    .compass-marker.selected {
      border-color: #fbbf24;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.5), 0 2px 8px rgba(0,0,0,0.5);
      transform: translate(-50%, -50%) scale(1.22);
      z-index: 12;
    }

    .selection-info {
      text-align: center;
      margin: 0.9rem 0 0.7rem;
      font-size: 0.95rem;
    }
    .selection-info strong { color: #fbbf24; }
    .btn-row { display: flex; gap: 0.6rem; margin-top: 0.6rem; }
    .btn-row button { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Valkompass</h1>
    <p class="subtitle">Testa om du verkligen stämmer med partiet du tror</p>

    <div id="step-party" class="card">
      <p style="margin-bottom:0.85rem;font-size:0.92rem">Vilket parti stöder eller tror du dig stå närmast just nu?</p>

      <div class="compass-wrapper">
        <div class="compass" id="compass">
          <div class="compass-label top">GAL</div>
          <div class="compass-label bottom">TAN</div>
          <div class="compass-label left">Vänster</div>
          <div class="compass-label right">Höger</div>
        </div>
      </div>

      <div id="selection-panel" class="hidden">
        <div class="selection-info">Du har valt: <strong id="selected-name"></strong></div>
        <div class="btn-row">
          <button class="secondary" id="btn-back">Tillbaka</button>
          <button id="btn-start">Starta test</button>
        </div>
      </div>

      <div id="list-section">
        <p style="font-size:0.78rem;color:#94a3b8;margin:0.7rem 0 0.55rem">Eller välj från listan (störst först enligt 2022):</p>
        <div id="party-list"></div>
      </div>
    </div>

    <div id="step-questions" class="card hidden">
      <div class="progress"><div class="progress-bar" id="progress"></div></div>
      <div class="question" id="question-text"></div>
      <div class="options" id="options"></div>
    </div>

    <div id="step-results" class="card hidden">
      <h2 style="margin-bottom:0.9rem;font-size:1.1rem">Ditt resultat</h2>
      <p id="chosen-summary" style="margin-bottom:1rem;color:#94a3b8;font-size:0.88rem"></p>
      <div id="results-list"></div>
      <button onclick="location.reload()" style="margin-top:1.3rem;background:#475569">Gör om testet</button>
    </div>
  </div>

  <script>
    const parties = [
      { id: "s",    name: "Socialdemokraterna",     short: "S",   pct: "30,3 %", x: 32, y: 48 },
      { id: "sd",   name: "Sverigedemokraterna",    short: "SD",  pct: "20,5 %", x: 78, y: 78 },
      { id: "m",    name: "Moderaterna",            short: "M",   pct: "19,1 %", x: 72, y: 55 },
      { id: "v",    name: "Vänsterpartiet",         short: "V",   pct: "6,8 %",  x: 12, y: 28 },
      { id: "c",    name: "Centerpartiet",          short: "C",   pct: "6,7 %",  x: 48, y: 38 },
      { id: "kd",   name: "Kristdemokraterna",      short: "KD",  pct: "5,3 %",  x: 70, y: 68 },
      { id: "mp",   name: "Miljöpartiet",           short: "MP",  pct: "5,1 %",  x: 22, y: 18 },
      { id: "l",    name: "Liberalerna",            short: "L",   pct: "4,6 %",  x: 58, y: 32 },
      { id: "nyans",name: "Partiet Nyans",          short: "NY",  pct: "0,4 %",  x: 38, y: 42 },
      { id: "afs",  name: "Alternativ för Sverige", short: "AFS", pct: "0,3 %",  x: 88, y: 88 },
      { id: "med",  name: "Medborgerlig Samling",   short: "MED", pct: "0,2 %",  x: 75, y: 45 }
    ];

    const questions = [
      {
        text: "Sverige bör ha mycket stramare invandringsregler än idag.",
        options: [
          { label: "Helt enig", scores: { sd: 2, afs: 2, m: 1, kd: 1, med: 1, l: 0, c: -1, s: -1, mp: -2, v: -2, nyans: -1 } },
          { label: "Delvis enig", scores: { sd: 1, afs: 1, m: 1, kd: 1, med: 1, l: 0, c: 0, s: 0, mp: -1, v: -1, nyans: 0 } },
          { label: "Delvis oenig", scores: { sd: -1, afs: -1, m: 0, kd: 0, med: 0, l: 0, c: 1, s: 1, mp: 1, v: 1, nyans: 1 } },
          { label: "Helt oenig", scores: { sd: -2, afs: -2, m: -1, kd: -1, med: -1, l: 0, c: 1, s: 2, mp: 2, v: 2, nyans: 1 } }
        ]
      },
      {
        text: "Straffen för våldsbrott bör bli betydligt hårdare.",
        options: [
          { label: "Helt enig", scores: { sd: 2, afs: 2, m: 2, kd: 1, med: 1, l: 1, c: 0, s: 0, mp: -1, v: -2, nyans: 0 } },
          { label: "Delvis enig", scores: { sd: 1, afs: 1, m: 1, kd: 1, med: 1, l: 1, c: 0, s: 0, mp: 0, v: -1, nyans: 0 } },
          { label: "Delvis oenig", scores: { sd: -1, afs: -1, m: 0, kd: 0, med: 0, l: 0, c: 0, s: 1, mp: 1, v: 1, nyans: 1 } },
          { label: "Helt oenig", scores: { sd: -2, afs: -2, m: -1, kd: -1, med: -1, l: 0, c: 0, s: 1, mp: 2, v: 2, nyans: 1 } }
        ]
      }
    ];

    let chosenParty = null;
    let currentQ = 0;
    let userScores = {};
    const markers = {};

    const compass = document.getElementById("compass");
    parties.forEach(p => {
      const marker = document.createElement("div");
      marker.className = "compass-marker";
      marker.style.left = p.x + "%";
      marker.style.top = p.y + "%";
      marker.textContent = p.short;
      marker.title = p.name;
      marker.onclick = () => selectParty(p);
      compass.appendChild(marker);
      markers[p.id] = marker;
    });

    const partyList = document.getElementById("party-list");
    parties.forEach(p => {
      const btn = document.createElement("button");
      btn.className = "party-btn";
      btn.innerHTML = `<span>${p.name}</span><span class="pct">${p.pct}</span>`;
      btn.onclick = () => selectParty(p);
      partyList.appendChild(btn);
    });

    function selectParty(party) {
      chosenParty = party;
      Object.values(markers).forEach(m => m.classList.remove("selected"));
      markers[party.id].classList.add("selected");
      document.getElementById("selected-name").textContent = party.name;
      document.getElementById("selection-panel").classList.remove("hidden");
      document.getElementById("list-section").classList.add("hidden");
    }

    document.getElementById("btn-back").onclick = () => {
      chosenParty = null;
      Object.values(markers).forEach(m => m.classList.remove("selected"));
      document.getElementById("selection-panel").classList.add("hidden");
      document.getElementById("list-section").classList.remove("hidden");
    };

    document.getElementById("btn-start").onclick = () => {
      if (!chosenParty) return;
      parties.forEach(p => userScores[p.id] = 0);
      currentQ = 0;
      document.getElementById("step-party").classList.add("hidden");
      document.getElementById("step-questions").classList.remove("hidden");
      showQuestion();
    };

    function showQuestion() {
      const q = questions[currentQ];
      document.getElementById("question-text").textContent = q.text;
      document.getElementById("progress").style.width = ((currentQ / questions.length) * 100) + "%";
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt.label;
        btn.onclick = () => answer(opt.scores);
        optionsDiv.appendChild(btn);
      });
    }

    function answer(scores) {
      for (const [id, val] of Object.entries(scores)) {
        userScores[id] = (userScores[id] || 0) + val;
      }
      currentQ++;
      if (currentQ < questions.length) showQuestion();
      else showResults();
    }

    function showResults() {
      document.getElementById("step-questions").classList.add("hidden");
      document.getElementById("step-results").classList.remove("hidden");
      const maxPossible = questions.length * 2;
      const ranked = parties.map(p => ({
        ...p,
        match: Math.round(((userScores[p.id] + maxPossible) / (maxPossible * 2)) * 100)
      })).sort((a, b) => b.match - a.match);

      const chosenMatch = ranked.find(r => r.id === chosenParty.id);
      document.getElementById("chosen-summary").textContent =
        `Du valde ${chosenParty.name}. Din faktiska matchning: ${chosenMatch.match}%`;

      const list = document.getElementById("results-list");
      list.innerHTML = "";
      ranked.forEach(r => {
        const div = document.createElement("div");
        div.className = "result-item";
        div.innerHTML = `
          <span>${r.name}</span>
          <span class="match ${r.match < 40 ? 'low' : ''}">${r.match}%</span>
          <div class="explanation" id="exp-${r.id}">
            Förklaring kommer här – varför du matchar eller inte matchar ${r.name}.
          </div>
        `;
        div.onclick = () => document.getElementById(`exp-${r.id}`).classList.toggle("open");
        list.appendChild(div);
      });
    }
  </script>
</body>
</html>
